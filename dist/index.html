<style>/* ==========================================================================
   AI LEADERS — dizayn tizimi (dark + light)
   Brend: hexagon + "A" sxemasi + yashil uchqun (#C6FF4F)
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#05070F; --bg-soft:#080D1B;
  --panel:#0C1324; --panel-2:#101A31; --panel-3:#141F3B;
  --line:#1B2745; --line-2:#243256;
  --txt:#E9EDF9; --txt2:#AEB9D6; --muted:#6E7B9E;
  --brand:#7C5CFF; --brand-2:#22D3EE; --accent:#C6FF4F;
  --ok:#38E1A0; --warn:#FFB43A; --danger:#FF5C7A; --coin:#FFD75E;
  --grad:linear-gradient(135deg,#7C5CFF 0%,#5B8CFF 50%,#22D3EE 100%);
  --grad-2:linear-gradient(135deg,#C6FF4F,#22D3EE);
  --r-xl:26px; --r:20px; --r-sm:14px; --r-xs:10px;
  --sh:0 18px 40px -22px rgba(0,0,0,.85);
  --sh-lift:0 26px 60px -28px rgba(9,12,32,.9);
  --nav-w:268px;
  --f:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
[data-theme="light"]{
  --bg:#F2F5FC; --bg-soft:#FFFFFF;
  --panel:#FFFFFF; --panel-2:#FAFBFF; --panel-3:#F2F5FD;
  --line:#E2E8F6; --line-2:#D2DAEE;
  --txt:#0A1024; --txt2:#41506F; --muted:#7381A1;
  --sh:0 16px 34px -24px rgba(30,44,90,.35);
  --sh-lift:0 24px 50px -26px rgba(30,44,90,.4);
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(124,92,255,.16),transparent 60%),
    radial-gradient(900px 560px at 92% 4%,rgba(34,211,238,.12),transparent 62%),
    var(--bg);
  color:var(--txt); font-family:var(--f); font-size:15px; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
[data-theme="light"] body{background:
    radial-gradient(1000px 560px at 8% -10%,rgba(124,92,255,.14),transparent 60%),
    radial-gradient(820px 520px at 96% 0%,rgba(34,211,238,.14),transparent 62%), var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:rgba(124,92,255,.4)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#25324f;border-radius:20px;border:3px solid transparent;background-clip:content-box}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#c9d3ea;background-clip:content-box}

/* ---------- ikonalar ---------- */
.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px;stroke-width:1.9}
.i.lg{width:26px;height:26px}
.i.xl{width:34px;height:34px;stroke-width:1.5}

/* ---------- util ---------- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.center{display:flex;align-items:center;justify-content:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.t2{color:var(--txt2)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.big{font-size:20px;font-weight:800;letter-spacing:-.01em}
.h1{font-size:clamp(22px,3.4vw,30px);font-weight:850;letter-spacing:-.02em;line-height:1.15;margin:0}
.h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0}
.h3{font-size:14.5px;font-weight:750;margin:0}
.mono{font-variant-numeric:tabular-nums}
.tr{text-align:right}
.tc{text-align:center}
.up{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;font-weight:800}
.nowrap{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.split-13{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.split-15{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split-16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.hide-sm{display:initial}
.only-sm{display:none}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:4px 0}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(56,225,160,.6);animation:pd 2s infinite}
@keyframes pd{70%{box-shadow:0 0 0 9px rgba(56,225,160,0)}100%{box-shadow:0 0 0 0 rgba(56,225,160,0)}}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative}
.card.tight{padding:13px}
.card.soft{background:var(--panel-2);box-shadow:none}
.card.glass{background:linear-gradient(160deg,rgba(124,92,255,.18),rgba(34,211,238,.08) 45%,transparent 80%),var(--panel);border-color:var(--line-2)}
.card.flat{border-radius:var(--r-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .h2{display:flex;align-items:center;gap:9px}
.tagline{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hr{height:1px;background:var(--line);border:0;margin:12px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:750;border:1px solid transparent;transition:.18s transform,.18s background,.18s border-color,.18s opacity;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{background:var(--grad);color:#0A0F1E;background-size:160% 160%}
.btn-primary:hover{background-position:100% 0}
.btn-accent{background:var(--accent);color:#10160A}
.btn-soft{background:var(--panel-3);border-color:var(--line);color:var(--txt)}
.btn-soft:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn-ghost{border-color:var(--line);color:var(--txt2)}
.btn-ghost:hover{color:var(--txt);border-color:var(--line-2)}
.btn-danger{background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.35);color:#FF8FA3}
.btn-ok{background:rgba(56,225,160,.14);border-color:rgba(56,225,160,.34);color:#6EF3BE}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn-xs{padding:6px 10px;font-size:11.5px;border-radius:9px;gap:6px}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.btn-icon:hover{color:var(--txt);border-color:var(--line-2)}
.btn-icon .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--panel)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12.5px;font-weight:650;color:var(--txt2);transition:.16s}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.on{background:var(--grad);color:#0A0F1E;border-color:transparent}
.chip.on-soft{background:rgba(124,92,255,.18);border-color:rgba(124,92,255,.45);color:#CFC2FF}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2)}
.tag.p{background:rgba(124,92,255,.16);border-color:rgba(124,92,255,.34);color:#C4B4FF}
.tag.c{background:rgba(34,211,238,.14);border-color:rgba(34,211,238,.3);color:#8FE7F6}
.tag.a{background:rgba(198,255,79,.14);border-color:rgba(198,255,79,.3);color:#D7FF8A}
.tag.o{background:rgba(255,180,58,.14);border-color:rgba(255,180,58,.32);color:#FFD08A}
.tag.r{background:rgba(255,92,122,.14);border-color:rgba(255,92,122,.32);color:#FF9AAB}
.tag.g{background:rgba(56,225,160,.14);border-color:rgba(56,225,160,.3);color:#7CF0C3}
.st{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;border:1px solid}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.st.wait{color:#FFD08A;background:rgba(255,180,58,.1);border-color:rgba(255,180,58,.3)}
.st.run{color:#8FE7F6;background:rgba(34,211,238,.1);border-color:rgba(34,211,238,.3)}
.st.ok{color:#7CF0C3;background:rgba(56,225,160,.1);border-color:rgba(56,225,160,.3)}
.st.bad{color:#FF9AAB;background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.3)}
.st.late{color:#FF8FA3;background:rgba(255,92,122,.12);border-color:rgba(255,92,122,.34)}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar.thin{height:6px}
.bar.accent>i{background:var(--grad-2)}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:var(--panel-3)}
.ring .fgc{stroke:url(#ringGrad)}
.ring .val{position:absolute;text-align:center;font-weight:850;letter-spacing:-.02em}

/* ---------- avatar ---------- */
.av{width:40px;height:40px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#08101F;
  background:var(--grad);flex:0 0 auto;position:relative;letter-spacing:-.02em}
.av.lg{width:54px;height:54px;font-size:19px;border-radius:18px}
.av.xl{width:76px;height:76px;font-size:27px;border-radius:22px}
.av.sm{width:30px;height:30px;font-size:11.5px;border-radius:10px}
.av.xs{width:26px;height:26px;font-size:10px;border-radius:9px}
.av-stack{display:flex;align-items:center}
.av-stack .av{margin-left:-9px;border:2px solid var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.av-stack .av:first-child{margin-left:0}
.on-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}
.off-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--muted);border:2.5px solid var(--panel)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px;
  background:linear-gradient(180deg,rgba(9,14,29,.96),rgba(5,7,15,.98));border-right:1px solid var(--line);z-index:50}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,#fff,#FAFBFF)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .mark{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(124,92,255,.45))}
.brand-txt strong{display:block;font-size:15.5px;font-weight:850;letter-spacing:.1em;line-height:1.1}
.brand-txt em{font-style:normal;font-size:9.5px;letter-spacing:.3em;color:var(--muted);font-weight:750}
.nav-lbl{padding:18px 12px 7px;font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.nav-lbl:first-child{padding-top:10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;color:var(--txt2);font-weight:650;font-size:14px;
  border:1px solid transparent;transition:.16s;position:relative}
.nav-item:hover{background:var(--panel-2);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(124,92,255,.22),rgba(34,211,238,.06));border-color:rgba(124,92,255,.34);color:#fff}
[data-theme="light"] .nav-item.on{color:#1B1140}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav-item .i{color:inherit;opacity:.9}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:850;background:var(--danger);color:#fff;border-radius:99px;padding:2px 7px}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px}
.userbox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line)}
.userbox small{display:block;color:var(--muted);font-size:11px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;padding:11px 22px 11px 18px;
  background:rgba(6,9,18,.72);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
.topbar .mobile-brand{display:none;align-items:center;gap:8px;font-weight:850;letter-spacing:.08em}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:180px;color:var(--muted)}
.searchbar input{background:none;border:0;outline:none;width:100%;font-size:13.5px;color:var(--txt)}
.searchbar{transition:border-color .18s,box-shadow .18s,background .18s}
.searchbar:hover{border-color:var(--line-2)}
.searchbar:focus-within{border-color:rgba(124,92,255,.6);box-shadow:0 0 0 3px rgba(124,92,255,.16);background:var(--panel)}
.content{padding:20px 18px 44px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.bottomnav{display:none}
.fab{display:none}

/* ---------- streak / pills ---------- */
.streak{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:850;font-size:13px;
  background:linear-gradient(135deg,rgba(255,180,58,.22),rgba(255,92,122,.18));border:1px solid rgba(255,180,58,.35);color:#FFCE7E}
.streak .i{animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.96)}}
.coin{display:inline-flex;align-items:center;gap:6px;font-weight:850;color:var(--coin)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-2);padding:22px;
  background:radial-gradient(700px 340px at 88% -20%,rgba(34,211,238,.22),transparent 62%),
             radial-gradient(520px 300px at 6% 120%,rgba(124,92,255,.3),transparent 60%),var(--panel)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(70% 80% at 70% 30%,#000 20%,transparent 75%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.5fr .9fr;gap:18px;align-items:center}
.spark-orb{position:absolute;border-radius:50%;filter:blur(28px);opacity:.55}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.16);color:#C4B4FF;border:1px solid rgba(124,92,255,.3)}
.kpi.c .ic{background:rgba(34,211,238,.14);color:#8FE7F6;border-color:rgba(34,211,238,.3)}
.kpi.a .ic{background:rgba(198,255,79,.14);color:#D7FF8A;border-color:rgba(198,255,79,.3)}
.kpi.r .ic{background:rgba(255,92,122,.14);color:#FF9AAB;border-color:rgba(255,92,122,.3)}
.kpi .v{font-size:26px;font-weight:850;letter-spacing:-.03em;line-height:1}
.kpi .d{font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:4px}
.kpi .d.up-c{color:#7CF0C3}.kpi .d.dn-c{color:#FF9AAB}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);transition:.16s}
.lrow:hover{border-color:var(--line-2);transform:translateX(2px)}
.lrow.press{cursor:pointer}
.lrow .lead{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2);flex:0 0 auto}
.lrow.hot{border-color:rgba(255,92,122,.32);background:linear-gradient(90deg,rgba(255,92,122,.08),transparent 60%)}
.lrow.done{opacity:.72}
.rank{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:13px;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2)}
.rank.r1{background:linear-gradient(135deg,#FFD75E,#FF9F1C);color:#2A1C00;border-color:transparent}
.rank.r2{background:linear-gradient(135deg,#D8E3F5,#9FB0CC);color:#1B2333;border-color:transparent}
.rank.r3{background:linear-gradient(135deg,#E8A76A,#C97B3C);color:#2A1600;border-color:transparent}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:9px;height:140px;padding-top:6px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.chart .fill{width:100%;max-width:34px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,#22D3EE,#7C5CFF);position:relative;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,1,.3,1) both}
.chart .b.hi .fill{background:linear-gradient(180deg,#C6FF4F,#22D3EE)}
.chart .b span{font-size:10.5px;color:var(--muted);font-weight:700}
@keyframes grow{from{transform:scaleY(.05);opacity:.3}to{transform:scaleY(1);opacity:1}}
.spark{width:100%;height:64px;overflow:visible}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-size:10.5px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-bottom:4px}
.cal .d{aspect-ratio:1/1.06;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;position:relative;transition:.16s}
.cal .d:hover{border-color:var(--line-2)}
.cal .d.out{opacity:.32}
.cal .d.today{border-color:var(--brand-2);background:rgba(34,211,238,.12);box-shadow:0 0 0 1px rgba(34,211,238,.4) inset}
.cal .d.has{cursor:pointer}
.cal .dots{display:flex;gap:3px;position:absolute;bottom:7px}
.cal .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal .d .n{font-size:12.5px}
@media(max-width:640px){.cal .d{aspect-ratio:1/1.18;font-size:12px;border-radius:10px}.cal .d .dots{bottom:5px}}

/* ---------- modal / sheet ---------- */
.mback{position:fixed;inset:0;z-index:120;background:rgba(3,5,12,.68);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease}
.mbox{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:20px;box-shadow:var(--sh-lift);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
.mbox.wide{max-width:760px}
.mbox.narrow{max-width:430px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:700px){
  .mback{padding:0;align-items:flex-end}
  .mbox{max-width:none;border-radius:24px 24px 0 0;max-height:92vh;padding:18px 16px 26px;animation:up .24s cubic-bezier(.2,1,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field>label{font-size:12px;font-weight:750;color:var(--txt2);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:14px;outline:none;transition:.16s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
textarea.inp{min-height:88px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp-hint{font-size:11.5px;color:var(--muted)}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--panel-3);border:1px solid var(--line);transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:rgba(124,92,255,.35);border-color:var(--brand)}
.switch.on::after{left:22px;background:var(--brand-2)}
.seg{display:flex;gap:5px;padding:5px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line);overflow:auto}
.seg button{padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:750;color:var(--txt2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--txt);box-shadow:0 4px 14px -8px #000}
.seg.on-accent button.on{background:var(--grad);color:#0A0F1E}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:200;left:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;max-width:min(380px,88vw)}
.toast{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line-2);
  box-shadow:var(--sh-lift);animation:tin .28s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:rgba(124,92,255,.16);color:#C4B4FF}
.toast.ok .ic{background:rgba(56,225,160,.16);color:#7CF0C3}
.toast.warn .ic{background:rgba(255,180,58,.16);color:#FFD08A}
.toast.err .ic{background:rgba(255,92,122,.16);color:#FF9AAB}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;font-size:12.5px;color:var(--txt2)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:700px){.toasts{left:12px;right:12px;bottom:86px;max-width:none}}

/* ---------- lesson / player ---------- */
.player{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#080D1B;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.player .ptn{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;opacity:.5}
.player .pbtn{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#08101F;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 30px -8px rgba(124,92,255,.8)}
.player .pbtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(34,211,238,.5);animation:rip 2.4s infinite}
@keyframes rip{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.lesson-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);border:1px solid transparent;transition:.16s;cursor:pointer}
.lesson-row:hover{background:var(--panel-2);border-color:var(--line)}
.lesson-row.on{background:var(--panel-2);border-color:rgba(124,92,255,.36)}
.lesson-row .num{width:32px;height:32px;border-radius:10px;background:var(--panel-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--txt2);flex:0 0 auto}
.lesson-row.done .num{background:rgba(56,225,160,.16);border-color:rgba(56,225,160,.34);color:#7CF0C3}

/* ---------- module card ---------- */
.mod{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:16px;box-shadow:var(--sh);transition:.2s}
.mod:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mod .mnum{position:absolute;right:14px;top:6px;font-size:56px;font-weight:900;letter-spacing:-.05em;color:var(--panel-3);line-height:1;pointer-events:none}
.mod .micon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.16);border:1px solid rgba(124,92,255,.3);color:#C4B4FF;margin-bottom:12px}
.mod.locked{opacity:.62}
.mod.locked .micon{background:var(--panel-3);border-color:var(--line);color:var(--muted)}

/* ---------- badge grid ---------- */
.badge-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);text-align:center;position:relative;overflow:hidden}
.badge-card .bi{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--grad);color:#08101F;box-shadow:0 10px 24px -12px rgba(124,92,255,.9)}
.badge-card.lock{opacity:.45}
.badge-card.lock .bi{background:var(--panel-3);color:var(--muted);box-shadow:none}
.badge-card.new::after{content:"YANGI";position:absolute;top:9px;right:-24px;transform:rotate(38deg);background:var(--accent);color:#10160A;font-size:8.5px;font-weight:900;padding:2px 24px;letter-spacing:.08em}

/* ---------- team crest ---------- */
.crest{width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.wall-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.wall-item:last-child{border-bottom:0}

/* ---------- gallery ---------- */
.gal{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--panel-2);transition:.2s;cursor:pointer}
.gal:hover{transform:translateY(-3px);border-color:var(--line-2)}
.gal .thumb{aspect-ratio:16/10;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal .thumb .mock{position:absolute;inset:12% 10% 0;background:rgba(6,10,22,.72);border:1px solid rgba(255,255,255,.14);border-radius:10px 10px 0 0;padding:8px;display:flex;flex-direction:column;gap:5px}
.gal .thumb .mock i{display:block;height:6px;border-radius:4px;background:rgba(255,255,255,.22)}
.gal .thumb .mock i.w1{width:60%}.gal .thumb .mock i.w2{width:82%}.gal .thumb .mock i.w3{width:44%}
.thumb.g1{background:linear-gradient(135deg,#7C5CFF,#22D3EE)}
.thumb.g2{background:linear-gradient(135deg,#22D3EE,#38E1A0)}
.thumb.g3{background:linear-gradient(135deg,#FF9F1C,#FF5C7A)}
.thumb.g4{background:linear-gradient(135deg,#C6FF4F,#22D3EE)}

/* ---------- certificate ---------- */
.cert{background:linear-gradient(160deg,#0B1226,#0E1A33 60%,#0A1424);border:1px solid #26375F;border-radius:20px;padding:26px;position:relative;overflow:hidden;color:#EAF0FF}
.cert::after{content:"";position:absolute;inset:10px;border:1px solid rgba(198,255,79,.28);border-radius:14px;pointer-events:none}
.cert .watermark{position:absolute;right:-30px;bottom:-40px;width:240px;opacity:.07}
.cert .wl{font-size:10.5px;letter-spacing:.3em;color:#8FA5D8;font-weight:800;text-transform:uppercase}
.cert .nm{font-size:clamp(20px,3vw,30px);font-weight:850;letter-spacing:-.02em;margin:6px 0 2px}
.cert .qr{width:64px;height:64px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:2px;flex:0 0 auto}
.cert .qr i{background:#C6FF4F;border-radius:1px}
.cert .sig{border-top:1px solid #33456F;padding-top:6px;font-size:10.5px;color:#94A7D6}

/* ---------- ruxsat: qulflangan bo'lim va namuna akkaunt qatorlari ---------- */
.nav-item.locked{opacity:.45;cursor:not-allowed}
.nav-item.locked:hover{color:var(--muted);transform:none}
.nav-item .lk{margin-left:auto;display:flex;color:var(--muted)}
.nav-item.locked .lk{color:var(--warn, #FFB020)}
.ubx-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:176px}
.userbox .ubx{max-width:176px}
.acc-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);transition:.16s}
.acc-row:hover{border-color:var(--line-2);background:var(--panel-3);transform:translateY(-1px)}
.acc-row .kbd{flex:0 0 auto}

/* ---------- jadval: rol teglari va kataklar ---------- */
.trow .tag{white-space:nowrap}
.trow .cell-hide{min-width:0}

/* ---------- auth: MVP kirish elementlari ---------- */
.auth-tabs{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px;margin-bottom:16px}
.auth-tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:750;color:var(--muted);transition:.16s}
.auth-tab:hover{color:var(--txt2)}
.auth-tab.on{background:linear-gradient(135deg,rgba(124,92,255,.24),rgba(34,211,238,.16));color:#fff;border:1px solid rgba(124,92,255,.4)}
[data-theme="light"] .auth-tab.on{color:#221262}
.form-err{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:650;
  background:rgba(255,92,122,.12);border:1px solid rgba(255,92,122,.34);color:#FF9AAB}
[data-theme="light"] .form-err{color:#B4234A}
.auth-demo{margin-top:18px;padding:14px;border-radius:var(--r-sm);border:1px dashed var(--line-2);background:var(--panel-2)}
.card.tight[data-print], #printZone .card{break-inside:avoid}

/* ---------- auth ---------- */
/* Kirish ekranida #app yon-panel gridi bo'lmasligi kerak (aks holda forma birinchi ustunga siqiladi) */
.app.authscreen{display:block;grid-template-columns:none}
.auth{min-height:100vh;display:grid;grid-template-columns:1.04fr .96fr}
.auth-art{position:relative;overflow:hidden;padding:44px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(760px 420px at 80% 10%,rgba(124,92,255,.34),transparent 62%),radial-gradient(600px 420px at 10% 90%,rgba(34,211,238,.24),transparent 62%),#070B18;border-right:1px solid var(--line)}
.auth-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent 78%)}
.auth-art>*{position:relative;z-index:1}
/* Muhim: .spark-orb absolute bo'lib qolishi kerak — aks holda flex oqimiga tushib
   kirish ekranini ~460px ga cho'zib yuboradi (pastdagi bloklar kesiladi). */
.auth-art>.spark-orb{position:absolute;z-index:0}
.auth-copy{max-width:520px}
.auth-stats{gap:10px;max-width:560px;margin-top:16px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:var(--bg)}
.auth-form .inner{width:100%;max-width:430px}
.role-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);text-align:left;transition:.18s;width:100%}
.role-card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.role-card.on{border-color:var(--brand);background:linear-gradient(120deg,rgba(124,92,255,.18),rgba(34,211,238,.06));box-shadow:0 0 0 3px rgba(124,92,255,.14)}
.orbit{position:absolute;border:1px dashed rgba(255,255,255,.14);border-radius:50%}
.float-slow{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-art{padding:26px 20px 22px;min-height:auto}
  .auth-form{padding:22px 16px 40px}
}

/* ---------- table-ish ---------- */
.trows{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(180px,1.6fr) 90px 120px 1fr 120px;gap:12px;align-items:center;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2)}
.trow.head{background:transparent;border:0;padding:0 13px;color:var(--muted);font-size:10.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:900px){
  .trow{grid-template-columns:1fr auto;gap:10px}
  .trow .cell-hide{display:none}
  .trow.head{display:none}
}

/* ---------- responsive shell ---------- */
@media(max-width:1080px){
  :root{--nav-w:236px}
  .hide-md{display:none}
}
@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  /* dashboard juftliklari telefonda bir ustunga tushadi (inline uslub o'rniga klass) */
  .split-13,.split-15,.split-16{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .topbar{position:sticky;padding:10px 13px}
  .topbar .mobile-brand{display:flex}
  .content{padding:14px 13px 108px;gap:14px}
  .hide-sm{display:none}
  .only-sm{display:initial}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;align-items:stretch;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(6,9,18,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  [data-theme="light"] .bottomnav{background:rgba(255,255,255,.94)}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:10px;font-weight:750}
  .bn.on{color:#fff;background:linear-gradient(180deg,rgba(124,92,255,.3),rgba(124,92,255,.08))}
  [data-theme="light"] .bn.on{color:#221262}
  .bn .i{width:21px;height:21px}
  .fab{display:flex;position:fixed;right:15px;bottom:88px;z-index:61;width:54px;height:54px;border-radius:50%;background:var(--grad);color:#08101F;align-items:center;justify-content:center;box-shadow:0 16px 34px -12px rgba(124,92,255,.9)}
  .hero{padding:17px}
  .hero-grid{grid-template-columns:1fr}
  .h1{font-size:21px}
  .chart{height:112px}
  .card{padding:14px}
}

/* ---------- light tema: kontrastni kuchaytirish ---------- */
[data-theme="light"] .tag.p{color:#4B2FD0;background:#EFEBFF;border-color:#CFC2FF}
[data-theme="light"] .tag.c{color:#04687C;background:#E3F9FD;border-color:#A6E6F2}
[data-theme="light"] .tag.a{color:#4A6600;background:#F2FFD9;border-color:#CBE98A}
[data-theme="light"] .tag.o{color:#855000;background:#FFF3DE;border-color:#F6D9A4}
[data-theme="light"] .tag.r{color:#AE1439;background:#FFE8EE;border-color:#F7C0CE}
[data-theme="light"] .tag.g{color:#086B4A;background:#E2FBF1;border-color:#A6EAD3}
[data-theme="light"] .tag{color:#41506F;background:#F2F5FD;border-color:#DDE4F3}
[data-theme="light"] .st.wait{color:#855000;background:#FFF3DE;border-color:#F6D9A4}
[data-theme="light"] .st.run{color:#04687C;background:#E3F9FD;border-color:#A6E6F2}
[data-theme="light"] .st.ok{color:#086B4A;background:#E2FBF1;border-color:#A6EAD3}
[data-theme="light"] .st.bad,[data-theme="light"] .st.late{color:#AE1439;background:#FFE8EE;border-color:#F7C0CE}
[data-theme="light"] .streak{color:#8A5300;background:#FFF1DC;border-color:#F5D49B}
[data-theme="light"] .coin{color:#8A6500}
[data-theme="light"] .kpi .d.up-c{color:#0B7A55}
[data-theme="light"] .nav-item.on{background:linear-gradient(90deg,rgba(124,92,255,.16),rgba(34,211,238,.05))}
[data-theme="light"] .hero::after{display:none}
[data-theme="light"] .mod .mnum{color:#E3E9F7;opacity:1}
[data-theme="light"] .cert{box-shadow:0 18px 40px -26px rgba(20,32,70,.45)}
.mod .mnum{opacity:.75}


/* ==========================================================================
   NOUTBUK / KOMPYUTER rejimi (≥981px) — keng layout, zichlik, tez ishlash
   ========================================================================== */

/* --- 1. Keng ekranlarda kontentdan to‘liq foydalanish --- */
@media (min-width:1500px){ .content{max-width:1460px;padding:22px 26px 44px} }
@media (min-width:1800px){ .content{max-width:1680px} }
@media (min-width:2200px){ .content{max-width:1860px} }
@media (min-width:1500px){
  .grid.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .grid.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .trow{grid-template-columns:minmax(220px,1.7fr) 120px 165px 1.5fr 150px;gap:16px}
}

/* --- 2. Noutbuk ekran bo‘yi past bo‘lganda zichroq --- */
@media (min-width:1024px) and (max-height:850px){
  .content{padding:16px 20px 34px;gap:13px}
  .hero{padding:18px}
  .hero .h1{font-size:24px}
  .kpi{padding:13px}
  .kpi .v{font-size:23px}
  .card{padding:15px}
  .nav-item{padding:10px 12px}
}

/* --- 3. Keng layout: asosiy ustun + yon ustun (rail) --- */
.wide-split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.wide-main,.wide-rail{display:grid;gap:14px;min-width:0;align-content:start}
/* karta ustun ichida hech qachon tashqariga chiqmasin */
.card{min-width:0}
.card>*{min-width:0}
.card-h{flex-wrap:wrap;row-gap:8px}
@media (min-width:1280px){
  .wide-split{grid-template-columns:minmax(0,1fr) 372px;align-items:start}
}
@media (min-width:1650px){
  .wide-split{grid-template-columns:minmax(0,1fr) 420px;gap:16px}
}
.rail-card{position:relative}

/* --- 4. Yig‘iladigan yon panel (joy tejash) --- */
.collapse-btn{margin-left:auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;transition:.16s}
.collapse-btn:hover{color:var(--txt);border-color:var(--line-2)}
@media (max-width:1079px){ .collapse-btn{display:none} }
.app.collapsed{--nav-w:80px}
.app.collapsed .brand{justify-content:center;padding:6px 0 14px}
.app.collapsed .brand-txt,.app.collapsed .verline,.app.collapsed .nav-item .nlbl,
.app.collapsed .userbox .ubx,.app.collapsed .side-foot .btn .blbl{display:none}
.app.collapsed .nav-lbl{font-size:0;height:1px;padding:0;margin:8px 14px;background:var(--line)}
.app.collapsed .nav-item{justify-content:center;padding:12px 0;gap:0}
.app.collapsed .nav-item.on::before{left:-14px}
.app.collapsed .nav-item .cnt{position:absolute;top:5px;right:9px;min-width:17px;padding:1px 4px;font-size:9px}
.app.collapsed .userbox{flex-direction:column;gap:8px;padding:9px 6px}
.app.collapsed .side-foot .btn{padding:9px 0;justify-content:center}
.app.collapsed .brand .mark{width:36px;height:36px}

/* --- 5. Buyruq paneli (Ctrl/Cmd + K) --- */
.mbox.pal{max-width:620px;padding:0;overflow:hidden;border-radius:20px}
.pal-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-head input{background:none;border:0;outline:none;font-size:15px;color:var(--txt);min-width:0}
.pal-list{max-height:min(56vh,440px);overflow:auto;padding:8px}
.pal-grp{padding:10px 10px 6px;font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pal-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:12px;text-align:left;border:1px solid transparent;transition:.13s}
.pal-item:hover{background:var(--panel-2)}
.pal-item.on{background:linear-gradient(90deg,rgba(124,92,255,.2),rgba(34,211,238,.06));border-color:rgba(124,92,255,.36)}
.pal-ic{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2);flex:0 0 auto}
.pal-item.on .pal-ic{background:rgba(124,92,255,.2);border-color:rgba(124,92,255,.4);color:#C4B4FF}
.pal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--line);color:var(--muted)}
.pal-foot .row{gap:7px}
.kbd{border:1px solid var(--line-2);border-bottom-width:2px;background:var(--panel-2);border-radius:7px;padding:3px 7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--txt2);white-space:nowrap}
.searchbar .kbd{margin-left:auto;pointer-events:auto;cursor:pointer}
.searchbar .kbd:hover{color:var(--txt);border-color:var(--brand-2)}
@media (max-width:1079px){ .searchbar .kbd{display:none} }

/* --- 6. Saralanadigan jadval sarlavhalari --- */
.th{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:10.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:.15s;padding:2px 0;text-align:left}
.th:hover{color:var(--txt)}
.th.on{color:var(--brand-2)}
.th .ar{font-size:9px;opacity:.9}
@media (max-width:980px){ .trow.head{display:none} }

/* --- 7. Keng ekranda ikki ustunli vazifalar va 3 ustunli modullar --- */
@media (min-width:1400px){
  .task-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .mod-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media (min-width:1280px){
  .gal-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
}

/* --- 9. Kirish ekrani: noutbukda bitta ekranga sig‘adi --- */
.feat-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:rgba(124,92,255,.18);border:1px solid rgba(124,92,255,.34);color:#C4B4FF;transition:transform .18s,background .18s,border-color .18s}
.auth-copy .row:hover .feat-ic{transform:translateY(-1px);background:rgba(124,92,255,.26);border-color:rgba(124,92,255,.5)}

@media (min-width:1024px){
  .auth-art{justify-content:center;padding:32px 40px}
  .auth-art>.auth-brand{position:absolute;top:30px;left:40px;right:40px}
  .auth-copy{max-width:680px}
  .auth-art h1{font-size:clamp(23px,2.15vw,32px)!important;line-height:1.13!important;margin:12px 0 10px!important}
  .auth-art .t2{font-size:13.5px;line-height:1.55;max-width:52ch}
  .auth-art .col{display:grid;grid-template-columns:1fr 1fr;gap:13px 26px!important;margin-top:16px!important}
  .auth-stats{max-width:100%!important;gap:9px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .auth-stats .card{padding:10px 12px}
  .auth-stats .big{font-size:19px}
}
@media (min-width:1024px) and (max-height:820px){
  .auth-art{padding:24px 36px}
  .auth-art>.auth-brand{top:22px;left:36px;right:36px}
  .auth-art h1{font-size:clamp(21px,1.9vw,27px)!important}
  /* Past bo'yli noutbuklarda statistika kartalari o'rniga — ixcham qator */
  .auth-stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 22px;margin-top:20px;max-width:660px!important}
  .auth-stats .card{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;box-shadow:none;border-radius:0}
  .auth-stats .card .big{font-size:16px}
  .auth-stats .card>.xs{font-size:12px}
  .auth-stats .card+.card::before{content:"·";color:var(--line-2);margin-right:6px;font-weight:800}
}

/* --- 8. Sahifa pastidagi panel (juda qisqa sahifalarda bo‘shliqni to‘ldiradi) --- */
.content-foot{display:none}
.card.stretch{display:flex;flex-direction:column}
.card.stretch .chart{flex:1 1 auto;min-height:150px}

@media (min-width:981px){
  .main{display:flex;flex-direction:column;min-height:100vh}
  .content{flex:1 1 auto;display:flex;flex-direction:column}
  .content-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .cf-brand{display:flex;align-items:center;gap:9px}
  .cf-brand b{color:var(--txt2);font-weight:800}
  .cf-brand em{font-style:normal;letter-spacing:.16em;font-size:10.5px;font-weight:750;color:var(--muted)}
  .cf-links{display:flex;gap:16px;flex-wrap:wrap}
  .cf-links a{color:var(--muted);font-weight:650;transition:color .16s}
  .cf-links a:hover{color:var(--txt)}
  .cf-meta{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .cf-dot{color:var(--line-2)}
  .cf-help{display:inline-flex;align-items:center;gap:5px;color:var(--txt2);border:1px solid var(--line);background:var(--panel-2);
    border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;transition:.16s}
  .cf-help:hover{color:var(--txt);border-color:var(--line-2)}
}

/* --- 8. Yuqoriga ko‘tarilish tugmasi (noutbuk uchun) --- */
.totop{position:fixed;right:24px;bottom:24px;z-index:55;width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line-2);color:var(--txt2);box-shadow:var(--sh-lift);display:none;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{color:var(--txt);border-color:var(--brand-2)}
@media(max-width:980px){
  /* topbar telefonda bir qatorga sig‘adi: brend + ixcham qidiruv + 2 tugma */
  .topbar{gap:7px}
  .topbar .searchbar{min-width:0;flex:1 1 auto;padding:8px 12px}
  .topbar .searchbar input{min-width:0;width:100%}
  .topbar .mobile-brand{flex:0 0 auto}
}
@media (min-width:981px){ .totop{display:inline-flex} }

/* --- 9. Noutbukda kursorni aniq ko‘rsatish --- */
@media (min-width:981px){
  .lrow.press:hover,.gal:hover,.mod:hover{cursor:pointer}
  .nav-item:hover .i{opacity:1}
  .card-h .h2 .i{color:var(--brand-2);opacity:.9}
  ::selection{background:rgba(124,92,255,.45)}
}

/* ---------- a11y ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-60px;left:14px;z-index:999;padding:11px 16px;border-radius:0 0 14px 14px;background:var(--grad);color:#0A0F1E;font-weight:800;font-size:13.5px;transition:top .2s}
.skip-link:focus{top:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (hover:none){ .lrow:hover{transform:none} .mod:hover{transform:none} .gal:hover{transform:none} }
/* rasm bo'lmagan holatda ham tashqi havolalar xavfsiz */
a[target="_blank"]{word-break:break-word}

/* ---------- keng jadval uchun skroll ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll .trows{min-width:760px}

/* ---------- print ---------- */
@media print{
  body{background:#fff}
  .sidebar,.topbar,.bottomnav,.fab,.toasts,.mback .mhead .btn-icon{display:none!important}
  .mback{position:static;background:#fff;padding:0;display:block}
  .mbox{max-width:none;box-shadow:none;border:0;padding:0}
  .cert{color:#0A1024;background:#fff;border-color:#0A1024}
}
/* ---------- haftalik lenta (7 kun) ---------- */
.strip7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:760px){
  /* telefonda siqilib buzilmasin: yonma-yon skroll */
  .strip7{grid-template-columns:repeat(7,minmax(86px,1fr));overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .strip7::-webkit-scrollbar{display:none}
}

function trapFocus(e) {
  if (e.key !== 'Tab') return;
  const box = document.querySelector('.mbox');
  if (!box) return;
  const items = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(x => x.offsetParent !== null || x === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }

}

function cxhash(str) {
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677);

  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return ('0000000' + (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36)).slice(-13);
}

function setAccountPass(acc, pass) {

/* Kirish: login = nick | HEMIS ID (12 xona) | admin uchun email */
function authLookup(login) {

  if (!raw) return null;
  if (/^\d{12}$/.test(digitsOnly(raw)) && digitsOnly(raw).length === raw.length) return accByHemis(raw);
  return accByEmail(raw) || accByNick(raw) || accByHemis(raw);
}
function authCheck(login, pass) {

  if (!acc) return { err: 'notfound', msg: 'Bunday nick, HEMIS ID yoki email topilmadi.' };

  if (acc.pass !== hashPass(acc.nick, pass)) return { err: 'pass', msg: 'Parol xato. Yana bir marta urinib ko‘ring.' };
  return { ok: true, acc };
}

const QUESTS = [
  { id: 'q1', t: 'Bugungi darsni tugatish', s: '10–15 daqiqalik bitta dars', xp: 30, i: 'book' },
  { id: 'q2', t: 'Jamoa yoki do‘stga yordam', s: 'Devorga yozing yoki savolga javob bering', xp: 20, i: 'heart' },
  { id: 'q3', t: 'Vazifa ustida 20 daqiqa', s: 'Loyihangizni bir qadam oldinga suring', xp: 25, i: 'rocket' }
];
function ensureQuests(st) {
  if (!S.quests) S.quests = {};
  const q = S.quests[st.id];
  if (!q || q.d !== todayISO()) S.quests[st.id] = { d: todayISO(), done: [] };
  return S.quests[st.id];
}
function addXp(st, xp, coins, questCode) { return awardXP(st, xp, coins, questCode); }
/* XP berish + kunlik topshiriqni avtomatik bajarish */
function awardXP(st, xp, coins, questCode) {
  st.xp += xp; st.coins += (coins || 0);
  let bonus = 0;
  if (questCode && QUESTS.some(q => q.id === questCode)) {
    const q = ensureQuests(st);
    if (!q.done.includes(questCode)) { q.done.push(questCode); bonus = (QUESTS.find(z => z.id === questCode) || {}).xp || 0; st.xp += bonus; }
  }
  if (st.id === (me() || {}).id) toast('ok', '+' + (xp + bonus) + ' XP', bonus ? 'Kunlik topshiriq ham bajarildi (+' + bonus + ').' : 'Hisobingizga qo‘shildi.');
  return xp + bonus;
}

/* ---------- Deadline ---------- */
function calData(offset) {
  const now = new Date();
  const y = now.getFullYear(), mo = now.getMonth() + offset;
  const first = new Date(y, mo, 1), last = new Date(y, mo + 1, 0);
  const startShift = (first.getDay() + 6) % 7;
  const cells = [];
  for (let i = 0; i < startShift; i++) cells.push({ out: true, d: new Date(y, mo, 1 - (startShift - i)) });
  for (let d = 1; d <= last.getDate(); d++) cells.push({ out: false, d: new Date(y, mo, d) });
  while (cells.length % 7) cells.push({ out: true, d: new Date(y, mo + 1, cells.length - startShift - last.getDate() + 1) });
  return { cells, label: UZ_M[((mo % 12) + 12) % 12] + ' ' + new Date(y, mo, 1).getFullYear(), offset };
}

  const cal = calData(UI.cal || 0);
  const map = {};
  S.tasks.forEach(t => { (map[t.dl] = map[t.dl] || []).push({ l: t.title, k: 'task' }); });
  Object.entries(S.groups).forEach(([i, g]) => Object.entries(g.dl || {}).forEach(([tid, d]) => {
    (map[d] = map[d] || []).push({ l: (taskOf(tid) || { title: tid }).title + ' — ' + g.name, k: 'team' });
  }));
  const late = lateStudents();
  const today = todayISO();
  if (!S.tasks.length) return emptyCard('cal', 'Deadline’lar hali belgilanmagan',
    'Vazifa yaratilganda uning sanasi shu kalendarga tushadi; jamoa uchun alohida sanalar ham belgilashingiz mumkin.',
    actionAllowed('tasks') ? '<button class="btn btn-primary" data-act="new-task">' + ico('plus', 'sm') + 'Vazifa berish</button>' : '');

  let h = '<div class="page-head"><div><h1 class="h1">Deadline boshqaruvi</h1>' +
    '<p class="t2 small" style="margin:6px 0 0">Umumiy va jamoa uchun alohida sanalar. Kechikkanlarni bir joydan ko‘rasiz.</p></div>' +
    '<button class="btn btn-primary btn-sm" data-act="deadline-open" data-id="">' + ico('plus', 'sm') + 'Deadline belgilash</button></div>';

  h += '<div class="grid g4">' +
    kpi('cal', S.tasks.length, 'Umumiy deadline', 'Modul vazifalari', '') +
    kpi('flag', Object.values(S.groups).reduce((a, g) => a + Object.keys(g.dl || {}).length, 0), 'Jamoa istisnolari', 'Alohida belgilangan', 'c') +
    kpi('alert', late.length, 'Kechikkan topshiriq', late.length ? 'Eslatma yuborish kerak' : 'Hammasi joyida', 'r') +
    kpi('check-c', onTimePct() + '%', 'O‘z vaqtida', 'Topshirish intizomi', 'a') + '</div>';

  h += '<div class="grid split-13">' +
    '<div class="card"><div class="card-h"><div class="row" style="gap:8px">' +
    '<button class="btn-icon" style="width:36px;height:36px" data-act="cal-prev">' + ico('left', 'sm') + '</button>' +
    '<h2 class="h2" style="min-width:150px;text-align:center">' + esc(cal.label) + '</h2>' +
    '<button class="btn-icon" style="width:36px;height:36px" data-act="cal-next">' + ico('right', 'sm') + '</button></div>' +
    '<div class="row xs muted wrap" style="gap:12px"><span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:#7C5CFF;display:block"></i>umumiy</span>' +
    '<span class="row" style="gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:#C6FF4F;display:block"></i>jamoa uchun</span></div></div>' +
    '<div class="cal">' + UZ_D.map(d => '<div class="hd">' + d + '</div>').join('') +
    cal.cells.map(c => { const ds = isoDate(c.d), items = map[ds] || [];
      return '<div class="d ' + (c.out ? 'out ' : '') + (ds === today ? 'today ' : '') + (items.length ? 'has' : '') + '" ' + (items.length ? 'data-act="cal-day2" data-d="' + ds + '"' : '') + '>' +
        '<span class="n">' + c.d.getDate() + '</span><div class="dots">' + items.slice(0, 4).map(it => '<i style="background:' + (it.k === 'team' ? '#C6FF4F' : '#7C5CFF') + '"></i>').join('') + '</div></div>';
    }).join('') + '</div></div>' +

    '<div class="col" style="gap:14px"><div class="card"><div class="card-h"><h2 class="h2">' + ico('alert') + 'Kechikkanlar ro‘yxati</h2>' +
    '<span class="tag r">' + late.length + '</span></div>' +
    (late.length ? '<div class="col" style="gap:9px;max-height:340px;overflow:auto">' + late.map(x => '<div class="lrow hot"><div class="row grow" style="gap:10px;min-width:0">' + avatar(x.st, 'xs') +
      '<div style="min-width:0"><div class="small ellip" style="font-weight:750">' + esc(x.st.name) + '</div><div class="xs muted ellip">' + esc(x.t.title) + ' • ' + fmtD(x.due) + '</div></div></div>' +
      '<button class="btn btn-xs btn-soft" data-act="nudge" data-id="' + x.st.id + '">' + ico('bell', 'sm') + '</button></div>').join('') + '</div>'
      : '<div class="empty">Kechikkan yo‘q 🎉</div>') + '</div>' +
    '<div class="card"><div class="card-h"><h2 class="h2">' + ico('users') + 'Jamoalar kesimida</h2></div>' +
    '<div class="col" style="gap:10px">' + S.groups.map(g => { const k2 = g.members.filter(id => lateStudents().some(x => x.st.id === id && (x.st.group === g.id))).length;
      return '<div class="row between small"><span class="row" style="gap:9px">' + crest(g, 26) + esc(g.name) + '</span>' +
        '<span class="row" style="gap:8px"><span class="tag ' + (k2 ? 'r' : 'g') + '">' + (k2 ? k2 + ' kechikkan' : 'intizomli') + '</span>' +
        '<button class="btn btn-xs btn-ghost" data-act="deadline-open" data-id="' + g.id + '">' + ico('clock', 'sm') + '</button></span></div>'; }).join('') + '</div></div></div></div>';
  return h;
}

/* ---------- Statistika ---------- */
function vStats() {
  const k = kpisAdmin();
  const modStats = S.modules.map(m => { const done = S.students.filter(s => modulePct(s, m.id).pct === 100).length;
    return { m, done, pct: S.students.length ? Math.round(done / S.students.length * 100) : 0 }; });
  const deployed = S.students.filter(s => ['t4', 't5'].some(t => { const p = subOf(s, t); return p && p.status === 'accepted'; })).length;
  const grads = S.students.filter(s => certsOf(s).length > 0).length;
  const byGroup = [...S.groups].sort((a, b) => b.xp - a.xp);
  const maxg = Math.max(...byGroup.map(g => g.xp));
  const retention = [100, 94, 89, 83, 78, activityPct()];

  let h = '<div class="page-head"><div><h1 class="h1">Statistika</h1>' +
    '<p class="t2 small" style="margin:6px 0 0">Asosiy ko‘rsatkichlar: faollik, intizom, modul tugatish va loyiha chiqarish.</p></div>' +
    (actionAllowed('stats') ? '<button class="btn btn-soft btn-sm" data-act="export">' + ico('download', 'sm') + 'Hisobotni yuklab olish</button>' : '') + '</div>';
  if (!S.students.length) return h + emptyCard('trend', 'Statistika uchun ma’lumot yo‘q',
    'Talabalar qo‘shilib, vazifalar topshirila boshlagach bu yerda faollik, intizom va modul tugatish ko‘rsatkichlari paydo bo‘ladi.');

  h += '<div class="grid g4">' +
    kpi('users', k.active + '/' + k.total, 'Haftalik faol talaba', activityPct() + '%', 'c') +
    kpi('check-c', k.onTime + '%', 'O‘z vaqtida topshirish', k.subs + ' topshiriq asosida', 'a') +
    kpi('book', grads, 'Modul tugatganlar', k.total ? Math.round(grads / k.total * 100) + '% klub' : '', '') +
    kpi('rocket', deployed, 'Loyiha chiqarganlar', 'GitHub + Vercel', 'a') + '</div>';

  h += '<div class="grid g2">' +
    '<div class="card"><div class="card-h"><h2 class="h2">' + ico('trend') + 'Modullar bo‘yicha tugatish</h2><span class="small muted">100% tugatgan talabalar</span></div>' +
    '<div class="col" style="gap:12px">' + modStats.map(x => '<div><div class="row between small" style="margin-bottom:6px"><span class="t2">' + x.m.n + '. ' + esc(x.m.title) + '</span><b>' + x.done + '/' + S.students.length + '</b></div>' + bar(x.pct) + '</div>').join('') + '</div></div>' +

    '<div class="card"><div class="card-h"><h2 class="h2">' + ico('flame') + 'Kohortani ushlab turish</h2><span class="tag c">Retention</span></div>' +
    '<div class="chart">' + retention.map((v, i) => '<div class="b' + (i === retention.length - 1 ? ' hi' : '') + '"><div class="fill" style="height:' + v + '%;animation-delay:' + (i * 55) + 'ms"></div><span>' + (i * 2) + '-h</span></div>').join('') + '</div>' +
    '<div class="divider"></div><div class="col" style="gap:8px">' +
    '<div class="row between small"><span class="muted">1-haftada qolganlar</span><b>100%</b></div>' +
    '<div class="row between small"><span class="muted">Hozirgi faollik</span><b>' + activityPct() + '%</b></div>' +
    '<div class="row between small"><span class="muted">Streak 7+ kun</span><b>' + S.students.filter(s => s.streak >= 7).length + ' talaba</b></div>' +
    '<div class="row between small"><span class="muted">Jim qolganlar</span><b>' + (S.students.length - k.active) + ' talaba</b></div></div></div></div>';

  h += '<div class="grid g2">' +
    '<div class="card"><div class="card-h"><h2 class="h2">' + ico('flag') + 'Jamoalar reytingi</h2><span class="small muted">Umumiy XP</span></div>' +
    '<div class="col" style="gap:12px">' + byGroup.map((g, i) => '<div><div class="row between small" style="margin-bottom:6px">' +
      '<span class="row" style="gap:9px"><span class="rank r' + (i + 1) + '" style="width:26px;height:26px;font-size:11px">' + (i + 1) + '</span>' + esc(g.name) + '</span><b>' + nf(g.xp) + '</b></div>' +
      bar(Math.round(g.xp / maxg * 100), i === 0 ? 'accent' : '') + '</div>').join('') + '</div></div>' +

    '<div class="card"><div class="card-h"><h2 class="h2">' + ico('star') + 'Eng yaxshi loyihalar</h2><span class="tag a">Galereya</span></div>' +
    '<div class="col" style="gap:10px">' + S.gallery.map(it => '<div class="lrow"><div class="lead">' + ico('rocket', 'sm') + '</div>' +
      '<div class="grow" style="min-width:0"><div class="small ellip" style="font-weight:750">' + esc(it.t) + '</div><div class="xs muted ellip">' + esc(it.kind) + ' • ' + esc(it.desc) + '</div></div>' +
      '<a class="btn btn-xs btn-soft" href="' + esc(it.link) + '" target="_blank" rel="noopener">' + ico('globe', 'sm') + '</a></div>').join('') + '</div>' +
    '<div class="divider"></div><div class="xs muted">Demo Day: 28-noyabr, Toshkent. Har jamoa 5 daqiqa pitch qiladi.</div></div></div>';

  h += '<div class="card"><div class="card-h"><h2 class="h2">' + ico('dash') + 'Xulosa va keyingi qadamlar</h2></div>' +
    '<div class="grid g3">' + [
      ['alert', 'Jim qolganlar', (S.students.length - k.active) + ' talaba 5+ kun kirmagan — mentor juftligi tayinlang'],
      ['clock', 'Kechikish', k.lateSt + ' ta kechikkan topshiriq — avatar/telefon orqali bog‘laning'],
      ['rocket', 'Loyiha bosqichi', deployed + ' talaba loyihasini jonli havola bilan chiqargan'],
      ['users', 'Jamoa balansi', 'Har jamoaga 3 a’zo: 1 builder, 1 dizayner, 1 growth'],
      ['trophy', 'Musobaqa', S.students.length ? 'Haftalik reyting g‘olibi: ' + esc([...S.students].sort((a, b) => b.wxp - a.wxp)[0].name) : 'Talabalar qo‘shilgach reyting boshlanadi'],
      ['cal', 'Offline kun', 'Oyiga bir marta offline demo-kun — keyingisi 28-noyabr']
    ].map(x => '<div class="card tight soft"><div class="row" style="gap:9px">' + ico(x[0], 'sm') + '<b class="small">' + esc(x[1]) + '</b></div>' +
      '<div class="xs muted" style="margin-top:8px">' + esc(x[2]) + '</div></div>').join('') + '</div></div>';
  return h;
}

function downloadBlob(content, filename, mime) {
  try {
    const blob = new Blob(['\ufeff' + content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) { } }, 4000);
    return true;
  } catch (e) { return false; }
}

document.addEventListener('submit', e => {
  const f = e.target;
  if (!f.dataset || !f.dataset.form) return;
  e.preventDefault();
  const fd = new FormData(f);
  const kind = f.dataset.form;
  /* Ruxsat: forma turi bo'yicha bo'lim tekshiruvi */
  const FORM_PERM = { 'new-student': 'students', 'admin-edit': null, 'new-admin': null, 'new-task': 'tasks', 'new-lesson': 'content', 'new-module': 'content',
    'new-group': 'groups', 'lesson-edit': 'content', 'new-gallery': 'content', 'new-mentor': 'content', 'group-member': 'groups' };
  if (Object.prototype.hasOwnProperty.call(FORM_PERM, kind) && isAdmin()) {
    const need = FORM_PERM[kind];
    const okPerm = need === null ? isFounder() : actionAllowed(need);
    if (!okPerm) { permDenied(need === null ? 'admins' : need); return; }
  }
  if (kind === 'login-student' || kind === 'login-admin') {
    const res = authCheck(fd.get('login'), fd.get('pass'));
    if (res.err === 'first') { UI.firstPass = { acc: res.acc.id }; UI.authErr = ''; paint(); return; }
    if (res.err) { UI.authErr = res.msg; paint(true); return; }
    finishLogin(res.acc); return;
  }
  if (kind === 'pass-change') {
    const a = meAcc();
    if (!a) { closeModal(); return; }
    const oldP = String(fd.get('old') || ''), p1 = String(fd.get('p1') || ''), p2 = String(fd.get('p2') || '');
    if (a.pass && a.pass !== hashPass(a.nick, oldP)) { toast('warn', 'Hozirgi parol xato', 'Qayta tekshirib ko‘ring.'); return; }
    if (p1.length < 4) { toast('warn', 'Parol juda qisqa', 'Kamida 4 belgi kiriting.'); return; }
    if (p1 !== p2) { toast('warn', 'Parollar mos emas', 'Ikki maydonga bir xil parol yozing.'); return; }
    setAccountPass(a, p1); closeModal();
    toast('ok', 'Parol yangilandi', 'Keyingi kirishda yangi parolni ishlatasiz.');
    return;
  }
  if (kind === 'setup-founder') {
    const p1 = String(fd.get('p1') || ''), p2 = String(fd.get('p2') || '');
    if (p1 !== p2) { UI.authErr = 'Parollar bir-biriga mos kelmadi. Qayta yozing.'; paint(true); return; }
    const r = createFounderAccount({ name: fd.get('name'), email: fd.get('email'), pass: p1 });
    if (r.err) { UI.authErr = r.msg || 'Xatolik yuz berdi.'; paint(true); return; }
    UI.authErr = '';
    finishLogin(r.acc);
    toast('ok', 'Founder akkaunti yaratildi', 'Xush kelibsiz, ' + r.acc.name.split(' ')[0] + '! Birinchi qadam — talaba qo‘shish.');
    return;
  }
  if (kind === 'first-pass') {
    const acc = accById(f.dataset.acc);
    const p1 = String(fd.get('p1') || ''), p2 = String(fd.get('p2') || '');
    if (p1.length < 4) { UI.authErr = 'Parol kamida 4 belgidan iborat bo‘lsin.'; paint(true); return; }
    if (p1 !== p2) { UI.authErr = 'Parollar bir-biriga mos kelmadi. Qayta yozing.'; paint(true); return; }
    const r = setAccountPass(acc, p1);
    if (r.err) { UI.authErr = r.msg || 'Xatolik'; paint(true); return; }
    finishLogin(acc);
    toast('ok', 'Parol o‘rnatildi', 'Keyingi kirishlarda shu paroldan foydalanasiz.');
    return;
  }
  if (kind === 'msg') {
    toast('ok', 'Xabar yuborildi', 'Xabar qabul qilindi va tarixda saqlandi.'); closeModal();
    S.activity.unshift({ who: isAdmin() ? (meAcc() ? meAcc().name : 'Admin') : me().name, what: 'xabar yubordi', at: 'hozir' }); save(); return;
  }
  if (kind === 'profile') {
    const s0 = me();
    s0.name = fd.get('name') || s0.name; s0.tg = fd.get('tg'); s0.phone = fd.get('phone'); s0.goal = fd.get('goal'); s0.bio = fd.get('bio');
    toast('ok', 'Profil saqlandi'); closeModal(); save(); paint(true); return;
  }
  if (kind === 'submit') {
    const s0 = me(), tid = f.dataset.task, task = taskOf(tid);
    let p = subOf(s0, tid);
    const fileIn = f.querySelector('input[type="file"]');
    const fl = (fileIn && fileIn.files && fileIn.files.length) ? fileIn.files[0] : null;
    const finish = fileData => {
      const data = { link: fd.get('link'), note: fd.get('note') || '', file: fl ? fl.name : '', fileData: fileData || '',
        at: todayISO(), status: 'in_review', score: null, fb: '', rev: '' };
      if (p && p.status !== 'accepted') Object.assign(p, data);
      else { p = { id: uid('p'), task: tid, st: s0.id, ...data }; S.submissions.push(p); }
      addXp(s0, 40, 15, 'q3');
      S.activity.unshift({ who: s0.name, what: '“' + task.title + '”ni topshirdi', at: 'hozir' });
      toast('ok', 'Topshiriq yuborildi', 'Holat: tekshirilmoqda. +40 XP');
      closeModal(); save(); paint(true);
    };
    /* 900 KB'gacha fayl to‘g‘ridan-to‘g‘ri brauzer xotirasida saqlanadi */
    if (fl && fl.size <= 900 * 1024) {
      const r = new FileReader();
      r.onload = () => finish(r.result);
      r.onerror = () => finish('');
      r.readAsDataURL(fl);
      return;
    }
    if (fl && fl.size > 900 * 1024) toast('warn', 'Fayl juda katta', 'Demo rejimda 900 KB gacha saqlanadi — faqat nom yozildi. Real versiyada Supabase Storage ishlatiladi.');
    finish('');
    return;
  }
  if (kind === 'team-submit') {
    const tid = f.dataset.task, g = myGroup(me()), task = taskOf(tid);
    if (!g) { toast('warn', 'Jamoa yo‘q'); closeModal(); return; }
    const link = fd.get('link'), note = (fd.get('note') || '').trim();
    g.members.forEach(mid => {
      const stx = get(S.students, mid);
      let p = subOf(stx, tid);
      const data = { link, note: (note ? '[Jamoaviy] ' + note : '[Jamoaviy topshiriq]'), at: todayISO(), status: 'in_review', score: null, fb: '', rev: '' };
      if (p && p.status !== 'accepted') Object.assign(p, data);
      else if (!p) S.submissions.push({ id: uid('p'), task: tid, st: mid, ...data });
      if (mid !== me().id) pushNotif(mid, 'Jamoaviy topshiriq yuborildi', g.name + ' — ' + task.title, 'users');
    });
    addXp(me(), 25, 10);
    S.activity.unshift({ who: me().name, what: '“' + task.title + '” jamoaviy topshiriqni yubordi', at: 'hozir' });
    toast('ok', 'Jamoaviy topshiriq yuborildi', g.members.length + ' a’zo nomidan • +25 XP');
    closeModal(); save(); paint(true); return;
  }

  if (kind === 'review') {
    const p = get(S.submissions, f.dataset.sub);
    const wasAccepted = p.status === 'accepted';
    p.score = Math.max(0, Math.min(100, parseInt(fd.get('score'), 10) || 0));
    p.status = fd.get('status'); p.fb = fd.get('fb') || 'Ko‘rib chiqildi.'; p.rev = isAdmin() ? ((meAcc() ? meAcc().name : 'Admin') + ' (mentor)') : me().name;
    const s0 = get(S.students, p.st);
    pushNotif(p.st, 'Vazifa baholandi', taskOf(p.task).title + ' — ' + p.score + '/100. Izohni o‘qing.', 'star');
    if (p.status === 'accepted' && !wasAccepted) { s0.xp += 60; toast('ok', 'Qabul qilindi', s0.name + 'ga +60 XP va izoh yuborildi.'); }
    else toast('warn', 'Qayta ishlashga yuborildi', s0.name + 'ga izoh bilan qaytarildi.');
    S.activity.unshift({ who: (meAcc() ? meAcc().name : 'Admin'), what: '“' + taskOf(p.task).title + '”ni baholadi (' + p.score + ')', at: 'hozir' });
    closeModal(); save(); paint(true); return;
  }
  if (kind === 'new-task') {
    const t2 = { id: uid('t'), m: fd.get('m'), title: fd.get('title'), brief: fd.get('brief') || '', dl: fd.get('dl') };
    S.tasks.push(t2);
    const to = fd.get('to');
    if (to === 'all') S.students.forEach(s => pushNotif(s.id, 'Yangi vazifa', t2.title + ' • deadline ' + fmtFull(t2.dl), 'task'));
    else { const g = groupOf(to); if (g) g.members.forEach(sid => pushNotif(sid, 'Jamoa vazifasi', t2.title + ' • ' + g.name, 'task')); g.dl[t2.id] = t2.dl; }
    S.activity.unshift({ who: (meAcc() ? meAcc().name : 'Admin'), what: 'yangi vazifa berdi: ' + t2.title, at: 'hozir' });
    toast('ok', 'Vazifa yuborildi', t2.title + ' • deadline ' + fmtFull(t2.dl)); closeModal(); save(); paint(true); return;
  }
  if (kind === 'new-lesson') {
    const data = { m: fd.get('m'), t: fd.get('t'), type: fd.get('type'), dur: parseInt(fd.get('dur'), 10) || 12, brief: fd.get('brief') || '', link: fd.get('link') || '' };
    if (f.dataset.id) {
      const l = lessonOf(f.dataset.id); Object.assign(l, data);
      toast('ok', 'Dars yangilandi', l.t);
    } else {
      const l = { id: uid('l'), d: todayISO(), ...data };
      S.lessons.push(l);
      toast('ok', 'Dars qo‘shildi', l.t + ' • ' + l.dur + ' daqiqa');
    }
    closeModal(); save(); paint(true); return;
  }

  if (kind === 'new-gallery') {
    const ow = fd.get('by');
    const g2x = myGroup(get(S.students, ow));
    S.gallery.unshift({ id: uid('gl'), t: fd.get('t'), desc: fd.get('desc') || '', by: ow, kind: g2x ? g2x.name + ' jamoasi' : 'Shaxsiy loyiha', link: fd.get('link'), k: fd.get('k') || 'g1' });
    toast('ok', 'Galereyaga qo‘shildi', fd.get('t')); closeModal(); save(); paint(true); return;
  }

  if (kind === 'new-mentor') {
    const m2 = { id: uid('mt'), name: fd.get('name'), role: fd.get('role') || 'Mentor', tg: fd.get('tg') || '@mentor', rating: 5.0, groups: [], bio: fd.get('bio') || 'Yangi mentor.' };
    S.mentors.push(m2);
    toast('ok', 'Mentor qo‘shildi', m2.name + ' — jamoalarga biriktirishingiz mumkin.'); closeModal(); save(); paint(true); return;
  }
  if (kind === 'new-module') {
    const m = { id: uid('m'), n: S.modules.length + 1, title: fd.get('title'), desc: fd.get('desc') || '', icon: 'spark' };
    S.modules.push(m); toast('ok', 'Yangi modul qo‘shildi', m.n + '-modul: ' + m.title); closeModal(); save(); paint(true); return;
  }
  if (kind === 'new-student') {
    /* 1) Akkaunt: HEMIS ID tekshiriladi + unikal nick beriladi */
    const res = createStudentAccount({ name: fd.get('name'), phone: fd.get('phone'), hemisId: fd.get('hemis'), groupId: fd.get('group') });
    if (res.err) { toast('warn', 'Qo‘shilmadi', res.msg); return; }
    /* 2) Talaba profili akkauntga bog'lanadi */
    const s = { id: uid('s'), name: fd.get('name'), tg: fd.get('tg') || '@talaba', phone: fd.get('phone') || '+998', group: fd.get('group') || '', xp: 0, wxp: 0, streak: 0, coins: 0, level: 'junior', act: true, score: 0, joined: todayISO(), bio: 'Yangi a’zo.', goal: fd.get('goal') || 'Birinchi loyihani chiqarish', done: [], last: 0 };
    S.students.push(s);
    res.acc.studentId = s.id; res.acc.groupId = s.group || null;
    if (s.group) { const g = groupOf(s.group); if (g) g.members.push(s.id); }
    S.friends[s.id] = []; S.incoming[s.id] = []; S.sent[s.id] = [];
    save(); closeModal();
    toast('ok', 'Talaba qo‘shildi', s.name + ' • nick: @' + res.acc.nick);
    loginCardModal(res.acc.id); paint(true); return;
  }
  if (kind === 'new-admin' || kind === 'admin-edit') {
    const isEdit = kind === 'admin-edit';
    const a2 = isEdit ? accById(f.dataset.id) : null;
    if (isEdit && !a2) return;
    const perms = (fd.getAll('perms') || []);
    if (isEdit) {
      const nm2 = a2.name;
      a2.name = fd.get('name') || a2.name;
      const em = String(fd.get('email') || '').trim().toLowerCase();
      if (em && em !== a2.email) { if (accByEmail(em)) { toast('warn', 'Band email', accByEmail(em).nick + ' shu emailni ishlatgan.'); return; } a2.email = em; }
      let nk = String(fd.get('nick') || '').trim().toLowerCase().replace(/[^a-z0-9_.]/g, '');
      if (nk && nk !== a2.nick) { if (accByEmail(nk) || nickTaken(nk, a2.id)) { toast('warn', 'Band nick', nk + ' allaqachon olingan.'); return; } a2.nick = nk; }
      a2.adminRole = fd.get('adRole') || a2.adminRole;
      a2.perms = perms.length ? perms : a2.perms;
      save(); closeModal(); paint(true); toast('ok', 'Saqlandi', nm2 + ' ma’lumotlari yangilandi.');
      return;
    }
    const r2 = createAdminAccount({ name: fd.get('name'), email: fd.get('email'), nick: fd.get('nick'), adRole: fd.get('adRole'), perms });
    if (r2.err) { toast('warn', 'Qo‘shilmadi', r2.msg); return; }
    save(); closeModal(); toast('ok', 'Admin qo‘shildi', r2.acc.name + ' • @' + r2.acc.nick);
    loginCardModal(r2.acc.id); paint(true); return;
  }
  if (kind === 'new-group') {
    const g = { id: uid('g'), name: fd.get('name'), project: fd.get('project') || 'Yangi loyiha g‘oyasi', mentor: fd.get('mentor') || 'mt1', members: [], xp: 0, dl: {} };
    (fd.getAll('members') || []).forEach(mid => { g.members.push(mid); const s = get(S.students, mid); if (s) s.group = g.id; });
    S.groups.push(g); S.walls[g.id] = [];
    toast('ok', 'Jamoa yaratildi', g.name + ' • ' + g.members.length + ' a’zo'); closeModal(); save(); paint(true); return;
  }
  if (kind === 'set-deadline') {
    const gid = fd.get('group'), tid = fd.get('task'), date = fd.get('date'), g = groupOf(gid);
    if (g) { g.dl[tid] = date; g.members.forEach(sid => pushNotif(sid, 'Deadline yangilandi', (taskOf(tid) || {}).title + ': ' + fmtFull(date), 'clock')); }
    toast('ok', 'Deadline saqlandi', g.name + ' • ' + fmtFull(date)); closeModal(); save(); paint(true); return;
  }
});
document.addEventListener('change', e => {
  const ss = e.target.closest('[data-act="sort-sel"]');
  if (ss) {
    UI.sort.k = ss.value;
    UI.sort.d = (ss.value === 'name' || ss.value === 'group') ? 1 : -1;
    paint(true); return;
  }
  const cg = e.target.closest('[data-act="change-group"]');
  if (cg && cg.value) {
    const stx = get(S.students, cg.dataset.id), g = groupOf(cg.value);
    S.groups.forEach(x => x.members = x.members.filter(m => m !== stx.id));
    g.members.push(stx.id); stx.group = g.id;
    pushNotif(stx.id, 'Jamoa o‘zgardi', g.name + ' jamoasiga o‘tkazildingiz.', 'users');
    toast('ok', 'Jamoa yangilandi', stx.name + ' → ' + g.name);
    save(); closeModal(); paint(true); return;
  }
  const imp = e.target.closest('#import-json');
  if (imp && imp.files && imp.files[0]) { importState(imp.files[0]); return; }
  const t = e.target.closest('[data-act="move-student"]');
  if (t && t.value) {
    const fromId = t.dataset.g, toId = t.value, to = groupOf(toId);
    const from = groupOf(fromId);
    if (from) from.members = from.members.filter(x => x !== toId);
    if (to) { to.members.push(toId); const s = get(S.students, toId); if (s) s.group = to.id; }
    toast('ok', 'Talaba ko‘chirildi', get(S.students, toId).name + ' → ' + to.name);
    save(); closeModal(); paint(true);
  }
});
const NAV_ORDER_S = ['home', 'lessons', 'tasks', 'team', 'deadlines', 'friends', 'info'];
const NAV_ORDER_A = ['admin', 'students', 'adminTasks', 'adminLessons', 'adminGroups', 'adminDeadlines', 'stats', 'settings'];
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  /* Ctrl/⌘ + K — buyruq paneli */
  if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); return; }
  if (e.key === 'Escape') { closeModal(); return; }
  trapFocus(e);
  /* Alt + 1…8 — bo'limlar */
  if (e.altKey && /^[1-8]$/.test(e.key)) {
    e.preventDefault();
    const order = isAdmin() ? NAV_ORDER_A : NAV_ORDER_S;
    const r = order[parseInt(e.key, 10) - 1];
    if (r) go(r);
    return;
  }
  if (typing) return;
  if (e.key === '/') { const gs = document.getElementById('gsearch'); if (gs) { e.preventDefault(); gs.focus(); } return; }
  if (e.key === '?') { e.preventDefault(); shortcutsModal(); return; }
  if (e.key === 't' || e.key === 'T') {
    const n = UI.theme === 'dark' ? 'light' : 'dark';
    UI.theme = n; S.theme = n; document.documentElement.dataset.theme = n; save(); paint(true); return;
  }
  if (e.key === 'n' || e.key === 'N') { notifModal(); return; }
});

/* ---------- Ishga tushirish ---------- */
S = loadState();
/* PWA yorliqlari: /?go=lessons kabi parametrlar */
try {
  const goWant = new URLSearchParams(location.search).get('go');
  if (goWant && ROUTES[goWant]) UI.pendingGo = goWant;
} catch (e) { }
UI.theme = S.theme || 'dark';
document.documentElement.dataset.theme = UI.theme;
/* Sessiya bo'lsa — qayta kiritmasdan davom etamiz (parol faqat chiqqach so'raladi) */
const _sesAcc = (S.session && accById(S.session.acc)) || null;
if (_sesAcc && _sesAcc.status === 'active' && !_sesAcc.mustSetPass) {
  S.role = _sesAcc.role; if (_sesAcc.studentId) S.user = _sesAcc.studentId;
  UI.authShow = false;
} else {
  UI.authShow = true;
}
UI.route = S.role === 'admin' ? 'admin' : 'home';

/* Service worker (PWA) — faqat https'da ishlaydi */
window.addEventListener('beforeinstallprompt', ev => { ev.preventDefault(); UI.installEvt = ev; paint(true); });
window.addEventListener('appinstalled', () => { UI.installEvt = null; toast('ok', 'AI Leaders o‘rnatildi', 'Endi ilova telefon ekranidan ochiladi.'); paint(true); });
window.addEventListener('online', () => toast('ok', 'Internet tiklandi', 'Ma’lumotlar saqlanmoqda.'));
window.addEventListener('offline', () => toast('warn', 'Internet yo‘q', 'Ilova oflayn rejimda ishlayapti — o‘zgarishlar saqlanadi.'));
window.addEventListener('scroll', () => {
  const top = document.getElementById('toTop');
  if (!top) return;
  const show = window.scrollY > 640;
  if (show !== top.classList.contains('show')) top.classList.toggle('show', show);
}, { passive: true });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => { }));
}
paint();
</script>
</body>
