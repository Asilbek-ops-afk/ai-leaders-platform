<style>/* ==========================================================================
   AI LEADERS — dizayn tizimi (dark + light)
   Brend: hexagon + "A" sxemasi + yashil uchqun (var(--accent))
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  /* Merino & Venice palitrasi: iliq qog'oz fon, chuqur ko'k siyoh, yumshoq ko'k aksent */
  --bg:#0A2A3D; --bg-soft:#0D3349;
  --panel:#11384F; --panel-2:#154159; --panel-3:#1A4B66;
  --line:rgba(132,179,206,.20); --line-2:rgba(132,179,206,.34);
  --txt:#F5EEDD; --txt2:#C9DDE9; --muted:#9CB9CB;
  --brand:#84B3CE; --brand-2:#CFE2EF; --brand-3:#5FA0C4; --accent:#F5EEDD;
  --ok:#7FC9A9; --warn:#E3B36A; --danger:#EE9C86; --coin:#E9C98C;
  --grad:linear-gradient(135deg,#1E6A93 0%,#16587B 52%,#0F3D57 100%);
  --grad-2:linear-gradient(135deg,#84B3CE,#16587B);
  --r-xl:26px; --r:20px; --r-sm:14px; --r-xs:10px;
  --sh:0 18px 40px -22px rgba(4,20,30,.9);
  --sh-lift:0 26px 60px -28px rgba(4,20,30,.95);
  --nav-w:268px;
  --f:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-d:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;
  --on-brand:#F5EEDD; --paper:#FFFDF7; --logo-fill:rgba(10,42,61,.55);
}
[data-theme="light"]{
  --bg:#F5EEDD; --bg-soft:#FFFCF4;
  --panel:#FFFDF7; --panel-2:#F8F1E1; --panel-3:#F1E8D4;
  --line:#E7DDC7; --line-2:#D9CDB1;
  --txt:#0F3D57; --txt2:#2C6183; --muted:#4A6C85;
  --brand:#16587B; --brand-2:#2F7DA6; --brand-3:#2F7DA6; --accent:#16587B;
  --ok:#1F7A5A; --warn:#8A5F14; --danger:#A8442F; --coin:#8A5F14;
  --grad-2:linear-gradient(135deg,#2F7DA6,#16587B);
  --sh:0 16px 34px -24px rgba(22,88,123,.30);
  --sh-lift:0 24px 50px -26px rgba(22,88,123,.34);
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%,rgba(var(--brand-rgb),.16),transparent 60%),
    radial-gradient(900px 560px at 92% 4%,rgba(var(--brand2-rgb),.12),transparent 62%),
    var(--bg);
  color:var(--txt); font-family:var(--f); font-size:15px; line-height:1.5;
  min-height:100vh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
[data-theme="light"] body{background:
    radial-gradient(1000px 560px at 8% -10%,rgba(var(--brand-rgb),.14),transparent 60%),
    radial-gradient(820px 520px at 96% 0%,rgba(var(--brand2-rgb),.14),transparent 62%), var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
::selection{background:rgba(var(--brand-rgb),.4)}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px;border-radius:8px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#1C5474;border-radius:20px;border:3px solid transparent;background-clip:content-box}
[data-theme="light"] ::-webkit-scrollbar-thumb{background:#D9CDB1;background-clip:content-box}

/* ---------- ikonalar ---------- */
.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px;stroke-width:1.9}
.i.lg{width:26px;height:26px}
.i.xl{width:34px;height:34px;stroke-width:1.5}

/* ---------- util ---------- */
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.center{display:flex;align-items:center;justify-content:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.hl{color:var(--brand2-tone)}                     /* dark: neon yoritilgan mayda matn */
[data-theme="light"] .hl{color:var(--brand2-ink)} /* light: AA 4.5+ (oq/karta fonda) */
.t2{color:var(--txt2)}
.small{font-size:12.5px}
.xs{font-size:11.5px}
.big{font-size:20px;font-weight:800;letter-spacing:-.01em}
.h1{font-size:clamp(22px,3.4vw,30px);font-weight:850;letter-spacing:-.02em;line-height:1.15;margin:0}
.h2{font-size:17px;font-weight:800;letter-spacing:-.01em;margin:0}
.h3{font-size:14.5px;font-weight:750;margin:0}
.mono{font-variant-numeric:tabular-nums}
.tr{text-align:right}
.tc{text-align:center}
.up{text-transform:uppercase;letter-spacing:.16em;font-size:10.5px;font-weight:800}
.nowrap{white-space:nowrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g5{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.split-13{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.split-15{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split-16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.hide-sm{display:initial}
.only-sm{display:none}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.divider{height:1px;background:var(--line);margin:4px 0}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(var(--ok-rgb),.6);animation:pd 2s infinite}
@keyframes pd{70%{box-shadow:0 0 0 9px rgba(var(--ok-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--ok-rgb),0)}}

/* ---------- card ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);position:relative}
.card.tight{padding:13px}
.card.soft{background:var(--panel-2);box-shadow:none}
.card.glass{background:linear-gradient(160deg,rgba(var(--brand-rgb),.18),rgba(var(--brand2-rgb),.08) 45%,transparent 80%),var(--panel);border-color:var(--line-2)}
.card.flat{border-radius:var(--r-sm)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .h2{display:flex;align-items:center;gap:9px}
.tagline{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hr{height:1px;background:var(--line);border:0;margin:12px 0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:750;border:1px solid transparent;transition:.18s transform,.18s background,.18s border-color,.18s opacity;white-space:nowrap}
.btn:active{transform:translateY(1px) scale(.995)}
.btn-primary{background:var(--grad);color:var(--on-brand);background-size:160% 160%}
.btn-primary:hover{background-position:100% 0}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-soft{background:var(--panel-3);border-color:var(--line);color:var(--txt)}
.btn-soft:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn-ghost{border-color:var(--line);color:var(--txt2)}
.btn-ghost:hover{color:var(--txt);border-color:var(--line-2)}
.btn-danger{background:rgba(var(--danger-rgb),.14);border-color:rgba(var(--danger-rgb),.35);color:var(--danger-tone)}
.btn-ok{background:rgba(var(--ok-rgb),.14);border-color:rgba(var(--ok-rgb),.34);color:var(--ok-tone)}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn-xs{padding:6px 10px;font-size:11.5px;border-radius:9px;gap:6px}
.btn-block{width:100%}
.btn-icon{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;position:relative}
.btn-icon:hover{color:var(--txt);border-color:var(--line-2)}
.btn-icon .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid var(--panel)}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel-2);font-size:12.5px;font-weight:650;color:var(--txt2);transition:.16s}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip.on{background:var(--grad);color:var(--on-brand);border-color:transparent}
.chip.on-soft{background:rgba(var(--brand-rgb),.18);border-color:rgba(var(--brand-rgb),.45);color:var(--brand-tone)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;font-size:11px;font-weight:800;letter-spacing:.02em;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2)}
.tag.p{background:rgba(var(--brand-rgb),.16);border-color:rgba(var(--brand-rgb),.34);color:var(--brand-tone)}
.tag.c{background:rgba(var(--brand2-rgb),.14);border-color:rgba(var(--brand2-rgb),.3);color:var(--brand2-tone)}
.tag.a{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.3);color:var(--accent-tone)}
.tag.o{background:rgba(var(--warn-rgb),.14);border-color:rgba(var(--warn-rgb),.32);color:var(--warn-tone)}
.tag.r{background:rgba(var(--danger-rgb),.14);border-color:rgba(var(--danger-rgb),.32);color:var(--danger-tone)}
.tag.g{background:rgba(var(--ok-rgb),.14);border-color:rgba(var(--ok-rgb),.3);color:var(--ok-tone)}
.st{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;border:1px solid}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.st.wait{color:var(--warn-tone);background:rgba(var(--warn-rgb),.1);border-color:rgba(var(--warn-rgb),.3)}
.st.run{color:var(--brand2-tone);background:rgba(var(--brand2-rgb),.1);border-color:rgba(var(--brand2-rgb),.3)}
.st.ok{color:var(--ok-tone);background:rgba(var(--ok-rgb),.1);border-color:rgba(var(--ok-rgb),.3)}
.st.bad{color:var(--danger-tone);background:rgba(var(--danger-rgb),.1);border-color:rgba(var(--danger-rgb),.3)}
.st.late{color:var(--danger-tone);background:rgba(var(--danger-rgb),.12);border-color:rgba(var(--danger-rgb),.34)}

/* ---------- progress ---------- */
.bar{height:8px;border-radius:99px;background:var(--panel-3);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s cubic-bezier(.3,1,.4,1)}
.bar.thin{height:6px}
.bar.accent>i{background:var(--grad-2)}
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:var(--panel-3)}
.ring .fgc{stroke:url(#ringGrad)}
.ring .val{position:absolute;text-align:center;font-weight:850;letter-spacing:-.02em}

/* ---------- avatar ---------- */
.av{width:40px;height:40px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--on-brand);
  background:var(--grad);flex:0 0 auto;position:relative;letter-spacing:-.02em}
.av.lg{width:54px;height:54px;font-size:19px;border-radius:18px}
.av.xl{width:76px;height:76px;font-size:27px;border-radius:22px}
.av.sm{width:30px;height:30px;font-size:11.5px;border-radius:10px}
.av.xs{width:26px;height:26px;font-size:10px;border-radius:9px}
.av-stack{display:flex;align-items:center}
.av-stack .av{margin-left:-9px;border:2px solid var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.4)}
.av-stack .av:first-child{margin-left:0}
.on-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2.5px solid var(--panel)}
.off-dot{position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;background:var(--muted);border:2.5px solid var(--panel)}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:18px 14px 14px;
  background:linear-gradient(180deg,rgba(13,51,73,.96),rgba(10,42,61,.98));border-right:1px solid var(--line);z-index:50}
[data-theme="light"] .sidebar{background:linear-gradient(180deg,#FFFDF7,#F8F1E1)}
.brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px}
.brand .mark{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(var(--brand-rgb),.45))}
.brand-txt strong{display:block;font-size:15.5px;font-weight:850;letter-spacing:.1em;line-height:1.1}
.brand-txt em{font-style:normal;font-size:9.5px;letter-spacing:.3em;color:var(--muted);font-weight:750}
.nav-lbl{padding:18px 12px 7px;font-size:10px;font-weight:850;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.nav-lbl:first-child{padding-top:10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:13px;color:var(--txt2);font-weight:650;font-size:14px;
  border:1px solid transparent;transition:.16s;position:relative}
.nav-item:hover{background:var(--panel-2);color:var(--txt)}
.nav-item.on{background:linear-gradient(90deg,rgba(var(--brand-rgb),.22),rgba(var(--brand2-rgb),.06));border-color:rgba(var(--brand-rgb),.34);color:#FFFDF7}
[data-theme="light"] .nav-item.on{color:var(--brand-ink)}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:14px;bottom:14px;width:3px;border-radius:0 4px 4px 0;background:var(--grad)}
.nav-item .i{color:inherit;opacity:.9}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:850;background:var(--danger);color:#FFFDF7;border-radius:99px;padding:2px 7px}
.side-nav{display:flex;flex-direction:column;gap:6px;min-height:0;overflow-y:auto;overflow-x:hidden;
  scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;flex:1 1 auto;padding-bottom:4px}
.side-nav::-webkit-scrollbar{width:7px}
.side-nav::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:20px}
.side-foot{margin-top:auto;padding-top:12px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
/* Past balandlikdagi noutbuklar (1366/1568×768): hamma menyu sig'adi */
@media (min-width:981px) and (max-height:860px){
  .sidebar{padding:12px 12px 10px}
  .brand{padding:4px 8px 10px}
  .brand .mark{width:36px;height:36px}
  .nav-lbl{padding:11px 12px 5px}
  .nav-item{padding:9px 11px;font-size:13.5px;border-radius:11px}
  .side-foot{padding-top:8px;gap:7px}
  .userbox{padding:8px}
  .sidebar .btn{font-size:13px;padding:9px 13px}
}
.userbox{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--panel-2);border:1px solid var(--line)}
.userbox small{display:block;color:var(--muted);font-size:11px;font-weight:600}

.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;padding:11px 22px 11px 18px;
  background:rgba(10,42,61,.82);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
[data-theme="light"] .topbar{background:rgba(255,255,255,.8)}
.topbar .mobile-brand{display:none;align-items:center;gap:8px;font-weight:850;letter-spacing:.08em}
.searchbar{display:flex;align-items:center;gap:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-width:180px;color:var(--muted)}
.searchbar input{background:none;border:0;outline:none;width:100%;font-size:13.5px;color:var(--txt)}
.searchbar{transition:border-color .18s,box-shadow .18s,background .18s}
.searchbar:hover{border-color:var(--line-2)}
.searchbar:focus-within{border-color:rgba(var(--brand-rgb),.6);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.16);background:var(--panel)}
.content{padding:20px 18px 44px;display:flex;flex-direction:column;gap:16px;width:100%;max-width:1280px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}
.bottomnav{display:none}
.fab{display:none}

/* ---------- streak / pills ---------- */
.streak{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;font-weight:850;font-size:13px;
  background:linear-gradient(135deg,rgba(var(--warn-rgb),.22),rgba(var(--danger-rgb),.18));border:1px solid rgba(var(--warn-rgb),.35);color:var(--warn-tone)}
.streak .i{animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}45%{transform:scale(1.14) rotate(-4deg)}70%{transform:scale(.96)}}
.coin{display:inline-flex;align-items:center;gap:6px;font-weight:850;color:var(--coin)}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);border:1px solid var(--line-2);padding:22px;
  background:radial-gradient(700px 340px at 88% -20%,rgba(var(--brand2-rgb),.22),transparent 62%),
             radial-gradient(520px 300px at 6% 120%,rgba(var(--brand-rgb),.3),transparent 60%),var(--panel)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(70% 80% at 70% 30%,#000 20%,transparent 75%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero-grid{display:grid;grid-template-columns:1.5fr .9fr;gap:18px;align-items:center}
.spark-orb{position:absolute;border-radius:50%;filter:blur(28px);opacity:.55}

/* ---------- KPI ---------- */
.kpi{display:flex;flex-direction:column;gap:10px;padding:15px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--sh)}
.kpi .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(var(--brand-rgb),.16);color:var(--brand-tone);border:1px solid rgba(var(--brand-rgb),.3)}
.kpi.c .ic{background:rgba(var(--brand2-rgb),.14);color:var(--brand2-tone);border-color:rgba(var(--brand2-rgb),.3)}
.kpi.a .ic{background:rgba(var(--accent-rgb),.14);color:var(--accent-tone);border-color:rgba(var(--accent-rgb),.3)}
.kpi.r .ic{background:rgba(var(--danger-rgb),.14);color:var(--danger-tone);border-color:rgba(var(--danger-rgb),.3)}
.kpi .v{font-size:26px;font-weight:850;letter-spacing:-.03em;line-height:1}
.kpi .d{font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:4px}
.kpi .d.up-c{color:var(--ok-tone)}.kpi .d.dn-c{color:var(--danger-tone)}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);transition:.16s}
.lrow:hover{border-color:var(--line-2);transform:translateX(2px)}
.lrow.press{cursor:pointer}
.lrow .lead{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2);flex:0 0 auto}
.lrow.hot{border-color:rgba(var(--danger-rgb),.32);background:linear-gradient(90deg,rgba(var(--danger-rgb),.08),transparent 60%)}
.lrow.done{opacity:.72}
.rank{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:850;font-size:13px;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2)}
.rank.r1{background:linear-gradient(135deg,var(--coin),#FF9F1C);color:#2A2118;border-color:transparent}
.rank.r2{background:linear-gradient(135deg,#E6EDF2,#AEC3D0);color:#17303F;border-color:transparent}
.rank.r3{background:linear-gradient(135deg,#D6A97A,#B98A5E);color:#2A2118;border-color:transparent}

/* ---------- chart ---------- */
.chart{display:flex;align-items:flex-end;gap:9px;height:140px;padding-top:6px}
.chart .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.chart .fill{width:100%;max-width:34px;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,var(--brand-2),var(--brand));position:relative;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,1,.3,1) both}
.chart .b.hi .fill{background:linear-gradient(180deg,var(--accent),var(--brand-2))}
.chart .b span{font-size:10.5px;color:var(--muted);font-weight:700}
@keyframes grow{from{transform:scaleY(.05);opacity:.3}to{transform:scaleY(1);opacity:1}}
.spark{width:100%;height:64px;overflow:visible}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{text-align:center;font-size:10.5px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;padding-bottom:4px}
.cal .d{aspect-ratio:1/1.06;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;position:relative;transition:.16s}
.cal .d:hover{border-color:var(--line-2)}
.cal .d.out{opacity:.32}
.cal .d.today{border-color:var(--brand-2);background:rgba(var(--brand2-rgb),.12);box-shadow:0 0 0 1px rgba(var(--brand2-rgb),.4) inset}
.cal .d.has{cursor:pointer}
.cal .dots{display:flex;gap:3px;position:absolute;bottom:7px}
.cal .dots i{width:5px;height:5px;border-radius:50%;display:block}
.cal .d .n{font-size:12.5px}
@media(max-width:640px){.cal .d{aspect-ratio:1/1.18;font-size:12px;border-radius:10px}.cal .d .dots{bottom:5px}}

/* ---------- modal / sheet ---------- */
.mback{position:fixed;inset:0;z-index:120;background:rgba(6,28,41,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .18s ease}
.mbox{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);padding:20px;box-shadow:var(--sh-lift);animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
.mbox.wide{max-width:760px}
.mbox.narrow{max-width:430px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media(max-width:700px){
  .mback{padding:0;align-items:flex-end}
  .mbox{max-width:none;border-radius:24px 24px 0 0;max-height:92vh;padding:18px 16px 26px;animation:up .24s cubic-bezier(.2,1,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:7px}
.field>label{font-size:12px;font-weight:750;color:var(--txt2);letter-spacing:.02em}
.inp,select.inp,textarea.inp{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:14px;outline:none;transition:.16s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(var(--brand-rgb),.18)}
textarea.inp{min-height:88px;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.inp-hint{font-size:11.5px;color:var(--muted)}
.switch{position:relative;width:46px;height:26px;border-radius:99px;background:var(--panel-3);border:1px solid var(--line);transition:.2s;flex:0 0 auto}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:rgba(var(--brand-rgb),.35);border-color:var(--brand)}
.switch.on::after{left:22px;background:var(--brand-2)}
.seg{display:flex;gap:5px;padding:5px;border-radius:var(--r-sm);background:var(--panel-2);border:1px solid var(--line);overflow:auto}
.seg button{padding:8px 12px;border-radius:10px;font-size:12.5px;font-weight:750;color:var(--txt2);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--txt);box-shadow:0 4px 14px -8px #000}
.seg.on-accent button.on{background:var(--grad);color:var(--on-brand)}

/* ---------- toasts ---------- */
.toasts{position:fixed;z-index:200;left:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;max-width:min(380px,88vw)}
.toast{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:var(--r-sm);background:var(--panel);border:1px solid var(--line-2);
  box-shadow:var(--sh-lift);animation:tin .28s cubic-bezier(.2,1.2,.4,1)}
.toast .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:rgba(var(--brand-rgb),.16);color:var(--brand-tone)}
.toast.ok .ic{background:rgba(var(--ok-rgb),.16);color:var(--ok-tone)}
.toast.warn .ic{background:rgba(var(--warn-rgb),.16);color:var(--warn-tone)}
.toast.err .ic{background:rgba(var(--danger-rgb),.16);color:var(--danger-tone)}
.toast b{display:block;font-size:13.5px}
.toast p{margin:2px 0 0;font-size:12.5px;color:var(--txt2)}
@keyframes tin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media(max-width:700px){.toasts{left:12px;right:12px;bottom:86px;max-width:none}}

/* ---------- lesson / player ---------- */
.player{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--bg-soft);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.player .ptn{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;opacity:.5}
.player .pbtn{width:64px;height:64px;border-radius:50%;background:var(--grad);color:var(--on-brand);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 10px 30px -8px rgba(var(--brand-rgb),.8)}
.player .pbtn::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(var(--brand2-rgb),.5);animation:rip 2.4s infinite}
@keyframes rip{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.lesson-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--r-sm);border:1px solid transparent;transition:.16s;cursor:pointer}
.lesson-row:hover{background:var(--panel-2);border-color:var(--line)}
.lesson-row.on{background:var(--panel-2);border-color:rgba(var(--brand-rgb),.36)}
.lesson-row .num{width:32px;height:32px;border-radius:10px;background:var(--panel-3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:var(--txt2);flex:0 0 auto}
.lesson-row.done .num{background:rgba(var(--ok-rgb),.16);border-color:rgba(var(--ok-rgb),.34);color:var(--ok-tone)}

/* ---------- module card ---------- */
.mod{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);padding:16px;box-shadow:var(--sh);transition:.2s}
.mod:hover{border-color:var(--line-2);transform:translateY(-2px)}
.mod .mnum{pointer-events:none}   /* v2.4.0: raqam-watermark olib tashlandi (premium.css ga qarang) */
.mod .micon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:rgba(var(--brand-rgb),.16);border:1px solid rgba(var(--brand-rgb),.3);color:var(--brand-tone);margin-bottom:12px}
.mod.locked{opacity:.62}
.mod.locked .micon{background:var(--panel-3);border-color:var(--line);color:var(--muted)}

/* ---------- badge grid ---------- */
.badge-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:15px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);text-align:center;position:relative;overflow:hidden}
.badge-card .bi{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--grad);color:var(--on-brand);box-shadow:0 10px 24px -12px rgba(var(--brand-rgb),.9)}
.badge-card.lock{opacity:.45}
.badge-card.lock .bi{background:var(--panel-3);color:var(--muted);box-shadow:none}
.badge-card.new::after{content:"YANGI";position:absolute;top:9px;right:-24px;transform:rotate(38deg);background:var(--accent);color:var(--accent-ink);font-size:8.5px;font-weight:900;padding:2px 24px;letter-spacing:.08em}

/* ---------- team crest ---------- */
.crest{width:52px;height:52px;flex:0 0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.wall-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px dashed var(--line)}
.wall-item:last-child{border-bottom:0}

/* ---------- gallery ---------- */
.gal{position:relative;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);background:var(--panel-2);transition:.2s;cursor:pointer}
.gal:hover{transform:translateY(-3px);border-color:var(--line-2)}
.gal .thumb{aspect-ratio:16/10;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gal .thumb .mock{position:absolute;inset:12% 10% 0;background:rgba(10,42,61,.82);border:1px solid rgba(255,255,255,.14);border-radius:10px 10px 0 0;padding:8px;display:flex;flex-direction:column;gap:5px}
.gal .thumb .mock i{display:block;height:6px;border-radius:4px;background:rgba(255,255,255,.22)}
.gal .thumb .mock i.w1{width:60%}.gal .thumb .mock i.w2{width:82%}.gal .thumb .mock i.w3{width:44%}
.thumb.g1{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.thumb.g2{background:linear-gradient(135deg,var(--brand-2),var(--ok))}
.thumb.g3{background:linear-gradient(135deg,#FF9F1C,var(--danger))}
.thumb.g4{background:linear-gradient(135deg,var(--accent),var(--brand-2))}

/* ---------- certificate ---------- */
.cert{background:linear-gradient(160deg,var(--panel),var(--panel-2) 60%,var(--panel));border:1px solid var(--cert-line);border-radius:20px;padding:26px;position:relative;overflow:hidden;color:#EFF6FA}
.cert::after{content:"";position:absolute;inset:10px;border:1px solid rgba(var(--accent-rgb),.28);border-radius:14px;pointer-events:none}
.cert .watermark{position:absolute;right:-30px;bottom:-40px;width:240px;opacity:.07}
.cert .wl{font-size:10.5px;letter-spacing:.3em;color:var(--muted);font-weight:800;text-transform:uppercase}
.cert .nm{font-size:clamp(20px,3vw,30px);font-weight:850;letter-spacing:-.02em;margin:6px 0 2px}
.cert .qr{width:64px;height:64px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:2px;flex:0 0 auto}
.cert .qr i{background:var(--accent);border-radius:1px}
.cert .sig{border-top:1px solid var(--cert-line-2);padding-top:6px;font-size:10.5px;color:var(--cert-sub)}

/* ---------- ruxsat: qulflangan bo'lim va namuna akkaunt qatorlari ---------- */
.nav-item.locked{opacity:.45;cursor:not-allowed}
.nav-item.locked:hover{color:var(--muted);transform:none}
.nav-item .lk{margin-left:auto;display:flex;color:var(--muted)}
.nav-item.locked .lk{color:var(--warn, var(--warn))}
.ubx-sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:176px}
.userbox .ubx{max-width:176px}
.acc-row{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);transition:.16s}
.acc-row:hover{border-color:var(--line-2);background:var(--panel-3);transform:translateY(-1px)}
.acc-row .kbd{flex:0 0 auto}

/* ---------- jadval: rol teglari va kataklar ---------- */
.trow .tag{white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.trow .cell-hide{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Adminlar jadvali: uzun rol/permission yorliqlari uchun o'z kengliklari */
.trows.adm .trow{grid-template-columns:minmax(190px,1.5fr) minmax(150px,192px) minmax(110px,1fr) 104px 176px}
@media(max-width:1100px){ .trows.adm .trow{grid-template-columns:minmax(0,1fr) auto} }

/* ---------- auth: MVP kirish elementlari ---------- */
.auth-tabs{display:flex;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px;margin-bottom:16px}
.auth-tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:750;color:var(--muted);transition:.16s}
.auth-tab:hover{color:var(--txt2)}
.auth-tab.on{background:linear-gradient(135deg,rgba(var(--brand-rgb),.24),rgba(var(--brand2-rgb),.16));color:#FFFDF7;border:1px solid rgba(var(--brand-rgb),.4)}
[data-theme="light"] .auth-tab.on{color:var(--brand-ink)}
.form-err{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:var(--r-sm);font-size:12.5px;font-weight:650;
  background:rgba(var(--danger-rgb),.12);border:1px solid rgba(var(--danger-rgb),.34);color:var(--danger-tone)}
[data-theme="light"] .form-err{color:var(--danger-ink)}
.auth-demo{margin-top:18px;padding:14px;border-radius:var(--r-sm);border:1px dashed var(--line-2);background:var(--panel-2)}
.card.tight[data-print], #printZone .card{break-inside:avoid}

/* ---------- auth ---------- */
/* Kirish ekranida #app yon-panel gridi bo'lmasligi kerak (aks holda forma birinchi ustunga siqiladi) */
.app.authscreen{display:block;grid-template-columns:none}
.auth{min-height:100vh;display:grid;grid-template-columns:1.04fr .96fr}
.auth-art{position:relative;overflow:hidden;padding:44px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(760px 420px at 80% 10%,rgba(var(--brand-rgb),.34),transparent 62%),radial-gradient(600px 420px at 10% 90%,rgba(var(--brand2-rgb),.24),transparent 62%),var(--bg);border-right:1px solid var(--line)}
.auth-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;
  mask-image:radial-gradient(80% 70% at 50% 40%,#000,transparent 78%)}
.auth-art>*{position:relative;z-index:1}
/* Muhim: .spark-orb absolute bo'lib qolishi kerak — aks holda flex oqimiga tushib
   kirish ekranini ~460px ga cho'zib yuboradi (pastdagi bloklar kesiladi). */
.auth-art>.spark-orb{position:absolute;z-index:0}
.auth-copy{max-width:520px}
.auth-stats{gap:10px;max-width:560px;margin-top:16px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:36px 24px;background:var(--bg)}
.auth-form .inner{width:100%;max-width:430px}
.role-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2);text-align:left;transition:.18s;width:100%}
.role-card:hover{border-color:var(--line-2);transform:translateY(-1px)}
.role-card.on{border-color:var(--brand);background:linear-gradient(120deg,rgba(var(--brand-rgb),.18),rgba(var(--brand2-rgb),.06));box-shadow:0 0 0 3px rgba(var(--brand-rgb),.14)}
.orbit{position:absolute;border:1px dashed rgba(255,255,255,.14);border-radius:50%}
.float-slow{animation:fl 7s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media(max-width:900px){
  .auth{grid-template-columns:1fr}
  .auth-art{padding:26px 20px 22px;min-height:auto}
  .auth-form{padding:22px 16px 40px}
}

/* ---------- table-ish ---------- */
.trows{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:minmax(180px,1.6fr) 90px 120px 1fr 120px;gap:12px;align-items:center;padding:11px 13px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--panel-2)}
.trow.head{background:transparent;border:0;padding:0 13px;color:var(--muted);font-size:10.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
@media(max-width:900px){
  .trow{grid-template-columns:1fr auto;gap:10px}
  .trow .cell-hide{display:none}
  .trow.head{display:none}
}

/* ---------- responsive shell ---------- */
@media(max-width:1080px){
  :root{--nav-w:236px}
  .hide-md{display:none}
}
@media(max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  /* dashboard juftliklari telefonda bir ustunga tushadi (inline uslub o'rniga klass) */
  .split-13,.split-15,.split-16{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .topbar{position:sticky;padding:10px 13px}
  .topbar .mobile-brand{display:flex}
  .content{padding:14px 13px 108px;gap:14px}
  .hide-sm{display:none}
  .only-sm{display:initial}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;align-items:stretch;gap:4px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));
    background:rgba(10,42,61,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
  [data-theme="light"] .bottomnav{background:rgba(255,255,255,.94)}
  .bn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;color:var(--muted);font-size:10px;font-weight:750}
  .bn.on{color:#FFFDF7;background:linear-gradient(180deg,rgba(var(--brand-rgb),.3),rgba(var(--brand-rgb),.08))}
  [data-theme="light"] .bn.on{color:var(--brand-ink)}
  .bn .i{width:21px;height:21px}
  .fab{display:flex;position:fixed;right:15px;bottom:88px;z-index:61;width:54px;height:54px;border-radius:50%;background:var(--grad);color:var(--on-brand);align-items:center;justify-content:center;box-shadow:0 16px 34px -12px rgba(var(--brand-rgb),.9)}
  .hero{padding:17px}
  .hero-grid{grid-template-columns:1fr}
  .h1{font-size:21px}
  .chart{height:112px}
  .card{padding:14px}

/* ---------- light tema: kontrastni kuchaytirish ---------- */
/* Yorug' mavzu: yorliqlar — YUMSHOQ fon + to'q siyoh matn
   (aks holda to'q brend rangi fon bo'lib, matn ko'rinmas bo'lib qolardi) */
[data-theme="light"] .tag.p{color:var(--brand-ink);background:rgba(var(--brand-rgb),.16);border-color:rgba(var(--brand-rgb),.34)}
[data-theme="light"] .tag.c{color:var(--brand2-ink);background:rgba(var(--brand2-rgb),.14);border-color:rgba(var(--brand2-rgb),.3)}
[data-theme="light"] .tag.a{color:var(--accent-ink);background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.3)}
[data-theme="light"] .tag.o{color:var(--warn-ink);background:rgba(var(--warn-rgb),.14);border-color:rgba(var(--warn-rgb),.32)}
[data-theme="light"] .tag.r{color:var(--danger-ink);background:rgba(var(--danger-rgb),.13);border-color:rgba(var(--danger-rgb),.32)}
[data-theme="light"] .tag.g{color:var(--ok-ink);background:rgba(var(--ok-rgb),.14);border-color:rgba(var(--ok-rgb),.3)}
[data-theme="light"] .tag{color:var(--txt2);background:#FBF6EA;border-color:var(--line-2)}
[data-theme="light"] .st.wait{color:var(--warn-ink);background:rgba(var(--warn-rgb),.13);border-color:rgba(var(--warn-rgb),.32)}
[data-theme="light"] .st.run{color:var(--brand2-ink);background:rgba(var(--brand2-rgb),.12);border-color:rgba(var(--brand2-rgb),.3)}
[data-theme="light"] .st.ok{color:var(--ok-ink);background:rgba(var(--ok-rgb),.13);border-color:rgba(var(--ok-rgb),.3)}
[data-theme="light"] .st.bad,[data-theme="light"] .st.late{color:var(--danger-ink);background:rgba(var(--danger-rgb),.12);border-color:rgba(var(--danger-rgb),.32)}
[data-theme="light"] .streak{color:#7A4A16;background:rgba(227,179,106,.22);border-color:rgba(227,179,106,.45)}
[data-theme="light"] .coin{color:var(--warn-ink)}
[data-theme="light"] .kpi .d.up-c{color:var(--ok-ink)}
/* Light mavzuda qizil/ko'k aksentlar oq fonda o'qiladi (AA 4.5+) */
[data-theme="light"] .kpi .d.dn-c{color:var(--danger-ink)}
[data-theme="light"] .th.on{color:var(--brand2-ink)}
[data-theme="light"] .btn-danger{background:#F7E7E0;border-color:var(--danger-tone);color:var(--danger-ink)}
[data-theme="light"] .btn-ok{background:#E7F3ED;border-color:#BCD9CB;color:var(--ok-ink)}
[data-theme="light"] .btn-accent{color:var(--accent-ink)}
[data-theme="light"] .nav-item.on{background:linear-gradient(90deg,rgba(var(--brand-rgb),.16),rgba(var(--brand2-rgb),.05))}
[data-theme="light"] .hero::after{display:none}
[data-theme="light"] .cert{box-shadow:0 18px 40px -26px rgba(22,88,123,.35)}



/* ==========================================================================
   NOUTBUK / KOMPYUTER rejimi (≥981px) — keng layout, zichlik, tez ishlash
   ========================================================================== */

/* --- 1. Keng ekranlarda kontentdan to‘liq foydalanish --- */
@media (min-width:1500px){ .content{max-width:1460px;padding:22px 26px 44px} }
@media (min-width:1800px){ .content{max-width:1680px} }
@media (min-width:2200px){ .content{max-width:1860px} }
@media (min-width:1500px){
  .grid.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .grid.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .trow{grid-template-columns:minmax(220px,1.7fr) 120px 165px 1.5fr 150px;gap:16px}
}

/* --- 2. Noutbuk ekran bo‘yi past bo‘lganda zichroq --- */
@media (min-width:1024px) and (max-height:850px){
  .content{padding:16px 20px 34px;gap:13px}
  .hero{padding:18px}
  .hero .h1{font-size:24px}
  .kpi{padding:13px}
  .kpi .v{font-size:23px}
  .card{padding:15px}
  .nav-item{padding:10px 12px}
}

/* --- 3. Keng layout: asosiy ustun + yon ustun (rail) --- */
.wide-split{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.wide-main,.wide-rail{display:grid;gap:14px;min-width:0;align-content:start}
/* karta ustun ichida hech qachon tashqariga chiqmasin */
.card{min-width:0}
.card>*{min-width:0}
.card-h{flex-wrap:wrap;row-gap:8px}
@media (min-width:1280px){
  .wide-split{grid-template-columns:minmax(0,1fr) 372px;align-items:start}
}
@media (min-width:1650px){
  .wide-split{grid-template-columns:minmax(0,1fr) 420px;gap:16px}
}
.rail-card{position:relative}

/* --- 4. Yig‘iladigan yon panel (joy tejash) --- */
.collapse-btn{margin-left:auto;width:34px;height:34px;border-radius:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt2);display:inline-flex;align-items:center;justify-content:center;transition:.16s}
.collapse-btn:hover{color:var(--txt);border-color:var(--line-2)}
@media (max-width:1079px){ .collapse-btn{display:none} }
.app.collapsed{--nav-w:80px}
.app.collapsed .brand{justify-content:center;padding:6px 0 14px}
.app.collapsed .brand-txt,.app.collapsed .verline,.app.collapsed .nav-item .nlbl,
.app.collapsed .userbox .ubx,.app.collapsed .side-foot .btn .blbl{display:none}
.app.collapsed .nav-lbl{font-size:0;height:1px;padding:0;margin:8px 14px;background:var(--line)}
.app.collapsed .nav-item{justify-content:center;padding:12px 0;gap:0}
.app.collapsed .nav-item.on::before{left:-14px}
.app.collapsed .nav-item .cnt{position:absolute;top:5px;right:9px;min-width:17px;padding:1px 4px;font-size:9px}
.app.collapsed .userbox{flex-direction:column;gap:8px;padding:9px 6px}
.app.collapsed .side-foot .btn{padding:9px 0;justify-content:center}
.app.collapsed .brand .mark{width:36px;height:36px}

/* --- 5. Buyruq paneli (Ctrl/Cmd + K) --- */
.mbox.pal{max-width:620px;padding:0;overflow:hidden;border-radius:20px}
.pal-head{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal-head input{background:none;border:0;outline:none;font-size:15px;color:var(--txt);min-width:0}
.pal-list{max-height:min(56vh,440px);overflow:auto;padding:8px}
.pal-grp{padding:10px 10px 6px;font-size:10px;font-weight:850;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pal-item{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:12px;text-align:left;border:1px solid transparent;transition:.13s}
.pal-item:hover{background:var(--panel-2)}
.pal-item.on{background:linear-gradient(90deg,rgba(var(--brand-rgb),.2),rgba(var(--brand2-rgb),.06));border-color:rgba(var(--brand-rgb),.36)}
.pal-ic{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-3);border:1px solid var(--line);color:var(--txt2);flex:0 0 auto}
.pal-item.on .pal-ic{background:rgba(var(--brand-rgb),.2);border-color:rgba(var(--brand-rgb),.4);color:var(--brand-tone)}
.pal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--line);color:var(--muted)}
.pal-foot .row{gap:7px}
.kbd{border:1px solid var(--line-2);border-bottom-width:2px;background:var(--panel-2);border-radius:7px;padding:3px 7px;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--txt2);white-space:nowrap}
.searchbar .kbd{margin-left:auto;pointer-events:auto;cursor:pointer}
.searchbar .kbd:hover{color:var(--txt);border-color:var(--brand-2)}
@media (max-width:1079px){ .searchbar .kbd{display:none} }

/* --- 6. Saralanadigan jadval sarlavhalari --- */
.th{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:10.5px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);transition:.15s;padding:2px 0;text-align:left}
.th:hover{color:var(--txt)}
.th.on{color:var(--brand-2)}
.th .ar{font-size:9px;opacity:.9}
@media (max-width:980px){ .trow.head{display:none} }

/* --- 7. Keng ekranda ikki ustunli vazifalar va 3 ustunli modullar --- */
@media (min-width:1400px){
  .task-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .mod-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media (min-width:1280px){
  .gal-grid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
}

/* --- 9. Kirish ekrani: noutbukda bitta ekranga sig‘adi --- */
.feat-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  background:rgba(var(--brand-rgb),.18);border:1px solid rgba(var(--brand-rgb),.34);color:var(--brand-tone);transition:transform .18s,background .18s,border-color .18s}
.auth-copy .row:hover .feat-ic{transform:translateY(-1px);background:rgba(var(--brand-rgb),.26);border-color:rgba(var(--brand-rgb),.5)}

@media (min-width:1024px){
  .auth-art{justify-content:center;padding:32px 40px}
  .auth-art>.auth-brand{position:absolute;top:30px;left:40px;right:40px}
  .auth-copy{max-width:680px}
  .auth-art h1{font-size:clamp(23px,2.15vw,32px)!important;line-height:1.13!important;margin:12px 0 10px!important}
  .auth-art .t2{font-size:13.5px;line-height:1.55;max-width:52ch}
  .auth-art .col{display:grid;grid-template-columns:1fr 1fr;gap:13px 26px!important;margin-top:16px!important}
  .auth-stats{max-width:100%!important;gap:9px;grid-template-columns:repeat(4,minmax(0,1fr))}
  .auth-stats .card{padding:10px 12px}
  .auth-stats .big{font-size:19px}
}
@media (min-width:1024px) and (max-height:820px){
  .auth-art{padding:24px 36px}
  .auth-art>.auth-brand{top:22px;left:36px;right:36px}
  .auth-art h1{font-size:clamp(21px,1.9vw,27px)!important}
  /* Past bo'yli noutbuklarda statistika kartalari o'rniga — ixcham qator */
  .auth-stats{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 22px;margin-top:20px;max-width:660px!important}
  .auth-stats .card{display:inline-flex;align-items:baseline;gap:8px;background:none;border:0;padding:0;box-shadow:none;border-radius:0}
  .auth-stats .card .big{font-size:16px}
  .auth-stats .card>.xs{font-size:12px}
  .auth-stats .card+.card::before{content:"·";color:var(--line-2);margin-right:6px;font-weight:800}
}

/* --- 8. Sahifa pastidagi panel (juda qisqa sahifalarda bo‘shliqni to‘ldiradi) --- */
.content-foot{display:none}
.card.stretch{display:flex;flex-direction:column}
.card.stretch .chart{flex:1 1 auto;min-height:150px}

@media (min-width:981px){
  .main{display:flex;flex-direction:column;min-height:100vh}
  .content{flex:1 1 auto;display:flex;flex-direction:column}
  .content-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
  .cf-brand{display:flex;align-items:center;gap:9px}
  .cf-brand b{color:var(--txt2);font-weight:800}
  .cf-brand em{font-style:normal;letter-spacing:.16em;font-size:10.5px;font-weight:750;color:var(--muted)}
  .cf-links{display:flex;gap:16px;flex-wrap:wrap}
  .cf-links a{color:var(--muted);font-weight:650;transition:color .16s}
  .cf-links a:hover{color:var(--txt)}
  .cf-meta{display:flex;align-items:center;gap:8px;font-size:11.5px}
  .cf-dot{color:var(--line-2)}
  .cf-help{display:inline-flex;align-items:center;gap:5px;color:var(--txt2);border:1px solid var(--line);background:var(--panel-2);
    border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;transition:.16s}
  .cf-help:hover{color:var(--txt);border-color:var(--line-2)}
}

/* --- 8. Yuqoriga ko‘tarilish tugmasi (noutbuk uchun) --- */
.totop{position:fixed;right:24px;bottom:24px;z-index:55;width:44px;height:44px;border-radius:14px;background:var(--panel);border:1px solid var(--line-2);color:var(--txt2);box-shadow:var(--sh-lift);display:none;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{color:var(--txt);border-color:var(--brand-2)}
@media(max-width:980px){
  /* topbar telefonda bir qatorga sig‘adi: brend + ixcham qidiruv + 2 tugma */
  .topbar{gap:7px}
  .topbar .searchbar{min-width:0;flex:1 1 auto;padding:8px 12px}
  .topbar .searchbar input{min-width:0;width:100%}
  .topbar .mobile-brand{flex:0 0 auto}
}
@media (min-width:981px){ .totop{display:inline-flex} }

/* --- 9. Noutbukda kursorni aniq ko‘rsatish --- */
@media (min-width:981px){
  .lrow.press:hover,.gal:hover,.mod:hover{cursor:pointer}
  .nav-item:hover .i{opacity:1}
  .card-h .h2 .i{color:var(--brand-2);opacity:.9}
  ::selection{background:rgba(var(--brand-rgb),.45)}
}

/* ---------- a11y ---------- */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:fixed;top:-60px;left:14px;z-index:999;padding:11px 16px;border-radius:0 0 14px 14px;background:var(--grad);color:var(--on-brand);font-weight:800;font-size:13.5px;transition:top .2s}
.skip-link:focus{top:0}

/* ==========================================================================
   LANDING SAHIFA (tizimga kirmagan foydalanuvchi)
   Struktura: yopishqoq nav + hero → bo'limlar → KIRISH/ARIZA (3D ochilish)
   ========================================================================== */
.land{position:relative;min-height:100vh;overflow-x:clip}
.lprog{position:fixed;top:0;left:0;right:0;height:3px;z-index:80;transform:scaleX(0);transform-origin:0 50%;
  background:linear-gradient(90deg,var(--brand),var(--brand-2) 55%,var(--accent))}
.lnav{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:18px;
  padding:13px clamp(16px,4vw,44px);border-bottom:1px solid transparent;transition:background .35s,border-color .35s,backdrop-filter .35s}
.lnav.scrolled{background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px) saturate(140%);border-color:var(--line)}
.lbrand{display:flex;align-items:center;gap:11px}
.lbrand-t{font-size:15px;font-weight:880;letter-spacing:.16em;line-height:1}
.lbrand-s{font-size:8.5px;letter-spacing:.32em;color:var(--muted);font-weight:750;margin-top:3px}
.lnav-links{display:flex;gap:2px;margin-left:auto}
.lnav-links a{padding:9px 13px;border-radius:10px;font-size:13px;font-weight:700;color:var(--txt2);text-decoration:none;transition:.18s}
.lnav-links a:hover{color:var(--txt);background:var(--panel-2)}
.lnav-cta{flex:0 0 auto}

/* --- Qahramon (hero) --- */
.lhero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(104px,13vh,150px) clamp(16px,4vw,44px) clamp(70px,9vh,110px);overflow:hidden}
.lhero-grid-bg{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:52px 52px;mask-image:radial-gradient(75% 65% at 30% 45%,#000 20%,transparent 78%);
  -webkit-mask-image:radial-gradient(75% 65% at 30% 45%,#000 20%,transparent 78%)}
[data-theme="light"] .lhero-grid-bg{background-image:linear-gradient(rgba(22,88,123,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(22,88,123,.07) 1px,transparent 1px)}
.lhero-orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.5;pointer-events:none}
.lhero-orb.o1{width:min(46vw,560px);aspect-ratio:1;background:var(--brand);top:-8%;right:-6%;animation:orbFloat 13s ease-in-out infinite}
.lhero-orb.o2{width:min(34vw,400px);aspect-ratio:1;background:var(--brand-2);bottom:2%;left:-8%;animation:orbFloat 16s ease-in-out infinite reverse}
.lhero-orb.o3{width:min(20vw,240px);aspect-ratio:1;background:var(--accent);top:42%;right:14%;opacity:.24;animation:orbFloat 11s ease-in-out infinite}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-22px,-26px,0)}}
.lhero-copy{position:relative;z-index:2;max-width:min(880px,100%)}
.ltag{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:800;
  letter-spacing:.02em;background:var(--panel-2);border:1px solid var(--line-2);color:var(--txt2)}
.ltag.p{background:linear-gradient(135deg,rgba(var(--brand-rgb),.2),rgba(var(--brand2-rgb),.10));border-color:rgba(var(--brand-rgb),.36);color:var(--txt)}
.ltag.a{background:linear-gradient(135deg,rgba(var(--accent-rgb),.16),rgba(var(--brand2-rgb),.10));border-color:rgba(var(--accent-rgb),.34);color:var(--txt)}
.lhero h1{font-size:clamp(31px,5.1vw,60px);line-height:1.06;letter-spacing:-.035em;font-weight:880;margin:20px 0 16px}
.lhero h1 em{font-style:normal;background:var(--grad-2);-webkit-background-clip:text;background-clip:text;color:transparent}
.llede{font-size:clamp(14.5px,1.25vw,17px);line-height:1.65;color:var(--txt2);max-width:60ch;margin:0}
.lcta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn-lg{padding:14px 22px;font-size:14.5px;border-radius:var(--r-sm)}
.lchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;max-width:680px;margin-top:34px}
.lchip{display:flex;align-items:center;gap:9px;padding:12px 14px;border-radius:var(--r-sm);
  background:linear-gradient(160deg,rgba(255,255,255,.045),transparent),var(--panel);border:1px solid var(--line)}
.lchip b{font-size:18px;font-weight:850;letter-spacing:-.02em}
.lchip span{font-size:11.5px;color:var(--muted)}
[data-theme="light"] .lchip{background:var(--panel)}
.lhero-float{position:absolute;right:clamp(24px,5vw,80px);top:34%;display:flex;flex-direction:column;gap:12px;z-index:2;width:250px}
.lfcard{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:var(--r-sm);
  background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line-2);backdrop-filter:blur(8px);
  box-shadow:var(--sh-lift);animation:floatY 6.5s ease-in-out infinite}
.lfcard b{display:block;font-size:13.5px;font-weight:800}
.lfcard span{display:block;font-size:11px;color:var(--muted)}
.lfcard.a{animation-delay:.2s}.lfcard.b{animation-delay:1.1s;margin-left:26px}.lfcard.c{animation-delay:2s}
.lfcard .i{color:var(--accent)}
.lfcard.b .i{color:var(--warn)}.lfcard.c .i{color:var(--brand-2)}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.lcue{position:absolute;left:50%;bottom:clamp(16px,3vh,30px);transform:translateX(-50%);z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);font-weight:750}
.lcue-m{width:22px;height:34px;border-radius:12px;border:1.5px solid var(--line-2);position:relative}
.lcue-m::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;background:var(--accent);transform:translateX(-50%);animation:cueDot 1.9s ease-in-out infinite}
@keyframes cueDot{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,13px)}}

/* Kirishda ko'rinadigan yumshoq chiqish (hero) */
.rise{animation:riseIn .85s cubic-bezier(.16,1,.3,1) both}
.rise[data-d="0"]{animation-delay:.05s}.rise[data-d="1"]{animation-delay:.14s}
.rise[data-d="2"]{animation-delay:.24s}.rise[data-d="3"]{animation-delay:.34s}.rise[data-d="4"]{animation-delay:.44s}
@keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* --- Skrollda ochiladigan bo'limlar --- */
.reveal{opacity:0;transform:translateY(30px)}
.reveal.in{opacity:1;transform:none;transition:opacity .8s ease,transform .95s cubic-bezier(.16,1,.3,1)}
.reveal.in[data-d="1"]{transition-delay:.09s}.reveal.in[data-d="2"]{transition-delay:.18s}
.reveal.in[data-d="3"]{transition-delay:.27s}.reveal.in[data-d="4"]{transition-delay:.36s}
.reveal.in[data-d="5"]{transition-delay:.45s}.reveal.in[data-d="6"]{transition-delay:.54s}
.lsec{position:relative;padding:clamp(58px,7.5vw,104px) clamp(16px,4vw,44px)}
.lsec-in{max-width:1200px;margin:0 auto}
.lsec-narrow{max-width:860px}
.lhead{max-width:760px;margin-bottom:clamp(26px,3.6vw,44px)}
.lh2{font-size:clamp(23px,3.1vw,38px);line-height:1.12;letter-spacing:-.03em;font-weight:870;margin:16px 0 12px}
.lsub{font-size:14.5px;line-height:1.68;color:var(--txt2);margin:0;max-width:62ch}
.lfeat{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:14px}
.lfeat-c{padding:20px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);position:relative;overflow:hidden}
.lfeat-c::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--brand-rgb),.7),transparent);opacity:0;transition:opacity .35s}
.lfeat-c:hover::after{opacity:1}
.lfeat-c h3{font-size:15.5px;font-weight:800;margin:14px 0 7px;letter-spacing:-.01em}
.lfeat-c p{font-size:13.5px;line-height:1.65;color:var(--txt2);margin:0}
.lfeat-ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--brand-2);
  background:linear-gradient(150deg,rgba(var(--brand-rgb),.22),rgba(var(--brand2-rgb),.12));border:1px solid rgba(var(--brand-rgb),.32)}
.lflow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;position:relative}
.lstep{position:relative;padding:22px 20px 20px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
.lstep-n{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-weight:880;font-size:15px;color:var(--on-brand);background:var(--grad-2)}
.lstep h3{font-size:15px;font-weight:800;margin:14px 0 7px}
.lstep p{font-size:13.5px;line-height:1.65;color:var(--txt2);margin:0}
.lprog-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:13px}
.lmodc{padding:18px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2)}
.lmodc-h{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.lmodc-n{font-size:12px;font-weight:850;color:var(--muted);letter-spacing:.08em}
.lmodc-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  color:var(--accent);background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.26)}
.lmodc-h b{font-size:14px;font-weight:790}
.lmodc p{font-size:13px;line-height:1.62;color:var(--txt2);margin:0 0 12px}
.lmodc-l{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:750;color:var(--muted)}
.lgame{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:18px}
.lgame-c{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-sm);
  background:linear-gradient(150deg,rgba(var(--brand-rgb),.14),transparent 70%),var(--panel);border:1px solid var(--line-2)}
.lgame-c b{display:block;font-size:13.5px;font-weight:800}
.lgame-c span{display:block;font-size:11.5px;color:var(--muted)}
.lgame-c .i{color:var(--coin);flex:0 0 auto}

/* Savol-javob (akkordeon) */
.lfaq{display:flex;flex-direction:column;gap:10px}
.fq{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);overflow:hidden;transition:border-color .25s}
.fq.open{border-color:var(--line-2);background:var(--panel-2)}
.fq-q{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:16px 18px;
  background:none;border:0;color:var(--txt);font-family:var(--f);font-size:14.5px;font-weight:750;text-align:left;cursor:pointer}
.fq-i{transition:transform .3s;color:var(--muted);flex:0 0 auto}
.fq.open .fq-i{transform:rotate(180deg);color:var(--accent)}
.fq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .34s cubic-bezier(.16,1,.3,1)}
.fq.open .fq-a{grid-template-rows:1fr}
.fq-a-in{overflow:hidden;font-size:13.5px;line-height:1.7;color:var(--txt2)}
.fq.open .fq-a-in{padding:0 18px 17px}

/* ==========================================================================
   KIRISH / ARIZA BO'LIMI — skrollda 3D «ochilish» animatsiyasi
   ========================================================================== */
.lauth{position:relative;padding:clamp(66px,8vw,116px) clamp(16px,4vw,44px) clamp(58px,7vw,100px);overflow:hidden}
.lauth-thread{position:absolute;left:50%;top:0;width:2px;height:clamp(60px,9vw,120px);transform:translateX(-50%) scaleY(0);transform-origin:50% 0;
  background:linear-gradient(180deg,transparent,rgba(var(--brand-rgb),.85),rgba(var(--brand2-rgb),.5))}
.lauth-thread::after{content:"";position:absolute;left:50%;bottom:-2px;width:8px;height:8px;border-radius:50%;transform:translateX(-50%);
  background:var(--accent);box-shadow:0 0 14px 4px rgba(var(--accent-rgb),.45)}
.lauth-glow{position:absolute;left:50%;bottom:-14%;width:min(1200px,140%);height:74%;transform:translateX(-50%) scale(.86);
  background:radial-gradient(58% 100% at 50% 100%,rgba(var(--brand-rgb),.30),transparent 72%);opacity:0;pointer-events:none}
.lauth-hero{position:relative;z-index:2;max-width:820px;margin:0 auto clamp(24px,3.4vw,40px);text-align:center}
.lauth-hero .ltag{margin-bottom:4px}
.lauth-wrap{position:relative;z-index:2;max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1.02fr;
  gap:clamp(20px,3.6vw,52px);align-items:center}
.lauth-pitch{display:flex;flex-direction:column;gap:12px}
.lpitch-r{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border-radius:var(--r-sm);
  background:var(--panel-2);border:1px solid var(--line);transition:transform .3s,border-color .3s}
.lpitch-r:hover{transform:translateX(4px);border-color:var(--line-2)}
.lpitch-r b{display:block;font-size:13.8px;font-weight:790;margin-bottom:4px}
.lpitch-r span{display:block;font-size:12.8px;line-height:1.6;color:var(--txt2)}
.lpitch-ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:var(--brand-2);background:linear-gradient(150deg,rgba(var(--brand-rgb),.2),rgba(var(--brand2-rgb),.1));border:1px solid rgba(var(--brand-rgb),.3)}

/* Karta: pastdan 3D burilib "ochiladi" */
.rev-card{position:relative;padding:22px;border-radius:var(--r);border:1px solid var(--line-2);
  background:linear-gradient(165deg,rgba(var(--brand-rgb),.10),transparent 55%),var(--panel);box-shadow:var(--sh-lift);
  opacity:0;transform:perspective(1400px) rotateX(17deg) translateY(54px) scale(.93);transform-origin:50% 100%}
.rev-card.in{opacity:1;transform:none;transition:opacity .8s ease,transform 1.05s cubic-bezier(.16,1,.3,1)}
.rev-card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,transparent 34%,rgba(var(--accent-rgb),.5) 50%,transparent 66%);background-size:240% 100%;
  background-position:150% 0;opacity:0;mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
  -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);mask-composite:exclude;-webkit-mask-composite:xor;padding:1px}
.rev-card.in::before{animation:sweepGlow 1.5s .3s ease-out 1}
@keyframes sweepGlow{0%{opacity:1;background-position:150% 0}80%{opacity:.85}100%{opacity:0;background-position:-40% 0}}
.rev-card .auth-tabs{margin-bottom:15px}
.lauth-note{margin-top:14px;text-align:center}
/* Karta ichidagi maydonlar ketma-ket chiqadi */
.lauth .rev-card form>*{opacity:0}
.lauth.in .rev-card form>*{animation:fieldIn .62s cubic-bezier(.16,1,.3,1) both}
.lauth.in .rev-card form>*:nth-child(1){animation-delay:.30s}
.lauth.in .rev-card form>*:nth-child(2){animation-delay:.38s}
.lauth.in .rev-card form>*:nth-child(3){animation-delay:.46s}
.lauth.in .rev-card form>*:nth-child(4){animation-delay:.54s}
.lauth.in .rev-card form>*:nth-child(5){animation-delay:.62s}
.lauth.in .rev-card form>*:nth-child(6){animation-delay:.70s}
@keyframes fieldIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
.lauth .rev-card .auth-tabs{opacity:0}
.lauth.in .rev-card .auth-tabs{animation:fieldIn .6s .2s cubic-bezier(.16,1,.3,1) both}
/* Ochilish effektlari faqat bir marta (qayta chizilganda ham .in qoladi) */
.lauth.in .lauth-thread{transform:translateX(-50%) scaleY(1);transition:transform 1.15s cubic-bezier(.16,1,.3,1)}
.lauth.in .lauth-glow{opacity:1;transform:translateX(-50%) scale(1);transition:opacity 1.2s ease,transform 1.5s cubic-bezier(.16,1,.3,1)}
.lauth.in .lauth-hero.reveal,.lauth.in .lauth-pitch.reveal{opacity:1;transform:none}
.lauth.in .lauth-pitch.reveal{transition:opacity .8s .18s,transform .95s .18s cubic-bezier(.16,1,.3,1)}
.lauth.in .lauth-hero.reveal{transition:opacity .7s,transform .8s cubic-bezier(.16,1,.3,1)}
/* Ariza muvaffaqiyati */
.ldone{text-align:center;padding:8px 4px 4px}
.ldone .i{color:var(--ok);width:40px;height:40px}
.ldone h3{font-size:18px;font-weight:830;margin:12px 0 8px}
.ldone p{font-size:13.5px;line-height:1.7;color:var(--txt2);margin:0 0 16px}

/* Sayt pastki qismi */
.lfoot{display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between;
  padding:26px clamp(16px,4vw,44px);border-top:1px solid var(--line);background:var(--bg-soft)}
.lfoot-links{display:flex;flex-wrap:wrap;gap:6px 14px}
.lfoot-links a{font-size:13px;font-weight:650;color:var(--txt2);text-decoration:none}
.lfoot-links a:hover{color:var(--txt)}

/* --- Moslashuvchanlik --- */
@media (max-width:1080px){
  .lnav-links{display:none}
  .lhero-float{display:none}
  .lauth-wrap{grid-template-columns:1fr;max-width:620px}
  .lauth-pitch{order:2}
  .rev-card{order:1}
  .lauth-hero{text-align:left;max-width:720px}
}
@media (max-width:720px){
  .lhero{padding-top:96px;min-height:auto}
  .lchips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lcue{display:none}
  .lcta .btn{width:100%}
  .lsec{padding:46px 16px}
  .lauth{padding:52px 16px}
  .rev-card{padding:17px}
  .lfoot{flex-direction:column;align-items:flex-start;gap:12px}
}
@media (max-height:700px) and (min-width:900px){
  .lhero{min-height:640px;padding-top:96px;padding-bottom:56px}
  .lhero-float{display:none}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
@media (hover:none){ .lrow:hover{transform:none} .mod:hover{transform:none} .gal:hover{transform:none} }
/* rasm bo'lmagan holatda ham tashqi havolalar xavfsiz */
a[target="_blank"]{word-break:break-word}

/* ---------- keng jadval uchun skroll ---------- */
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.table-scroll .trows{min-width:760px}

/* ==========================================================================
   v2.3.0 — DIZAYN SAYQALI (professional polish qatlami)
   1) tipografik nafas  2) mikro-animatsiya  3) holatlar (hover/focus/disabled)
   4) jadval va panel    5) mobil sayqal     6) bosma (print) tayyorligi
   ========================================================================== */

/* --- 1. Tipografiya --- */
.h1,.h2,.h3,.lhero h1,.lh2,.lauth-hero h2,.big,.ldone h3{text-wrap:balance}
p,.llede,.lsub,.fq-a-in{text-wrap:pretty}
.kpi .v,.lchip b,.lgame-c b,.strip7 .d b,.big,.trow .mono{font-variant-numeric:tabular-nums}
.lchip b,.lchip span,.lchip>div{white-space:nowrap}
.lchip{min-width:0}
.lchip>div{overflow:hidden;text-overflow:ellipsis}
.h1,.lh2{font-feature-settings:"ss01","cv11"}

/* Salomlashuvdagi qo'l ikonasi (emoji emas — SVG) */
.wave{display:inline-flex;align-items:center;vertical-align:-3px;color:var(--warn);
  transform-origin:72% 74%;animation:waveHi 2.6s ease-in-out infinite}
.wave .i{stroke-width:1.8}
@keyframes waveHi{0%,68%,100%{transform:rotate(0)}74%{transform:rotate(15deg)}80%{transform:rotate(-8deg)}86%{transform:rotate(12deg)}92%{transform:rotate(-4deg)}}
.print-only{display:none}

/* --- 2. Ankerlar yopishqoq nav ostida qolmasin --- */
#lhero,#limkon,#ljarayon,#ldastur,#lsavol,#lkirish{scroll-margin-top:80px}

/* --- 3. Yagona harakat tili --- */
.card,.kpi,.lfeat-c,.lstep,.lmodc,.lgame-c,.lfcard,.lchip,.lpitch-r{
  transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .35s,background .3s}
@media (hover:hover){
  .kpi:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--sh-lift)}
  .lfeat-c:hover,.lstep:hover,.lmodc:hover,.lgame-c:hover{transform:translateY(-4px);border-color:var(--line-2)}
  .lchip:hover{border-color:var(--line-2);transform:translateY(-2px)}
  .lfcard:hover{transform:translateY(-3px) scale(1.015)}
  .mod:hover,.gal:hover,.lrow:hover{border-color:var(--line-2)}
}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--grad);opacity:0;transition:opacity .35s}
.kpi.a::before{background:var(--grad-2)}
@media (hover:hover){.kpi:hover::before{opacity:.9}}
.kpi .d{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* --- 4. Tugmalar: holatlar va «sheen» --- */
.btn[disabled],.btn.off{opacity:.5;pointer-events:none;filter:saturate(.55)}
.btn-primary{position:relative;overflow:hidden;box-shadow:0 10px 24px -14px rgba(var(--brand-rgb),.9)}
.btn-primary::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.32) 50%,transparent 58%);transform:translateX(-135%);transition:transform .65s ease}
@media (hover:hover){.btn-primary:hover::after{transform:translateX(135%)}}
.btn-soft{box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.btn .i{transition:transform .25s cubic-bezier(.16,1,.3,1)}
@media (hover:hover){.btn:hover .i{transform:translateY(-1px)}}
[data-theme="light"] .btn-primary{color:#FFFDF7;box-shadow:0 10px 22px -14px rgba(60,40,180,.8)}

/* --- 5. Maydonlar va parol ko'zi --- */
.inp:hover:not(:focus){border-color:var(--line-2)}
.inp::placeholder{color:color-mix(in srgb,var(--muted) 76%,transparent)}
.inp.err,.inp[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px rgba(var(--danger-rgb),.16)}
.pwrap{position:relative}
.pwrap .inp{padding-right:44px}
.eye{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.2s}
.eye:hover{color:var(--txt);background:var(--panel-3)}
.eye.on{color:var(--brand-2)}
.auth-tab{white-space:nowrap}
@media(max-width:460px){
  .auth-tabs .auth-tab{font-size:12px;padding:9px 8px;gap:5px}
  .auth-tabs .auth-tab .tt2{display:none}
}
.auth-help{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--txt2);
  background:none;border:0;padding:2px;cursor:pointer;text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--brand-2) 55%,transparent);
  text-underline-offset:3px;transition:.2s}
.auth-help:hover{color:var(--brand-2)}

/* --- 6. Jadval (trows) --- */
.table-scroll .trow.head{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-radius:0;padding-top:6px;padding-bottom:6px}
.trow{transition:border-color .25s,background .25s,transform .25s}
.trow:not(.head):nth-child(even){background:color-mix(in srgb,var(--panel-2) 84%,var(--panel))}
@media (hover:hover){
  .trow:not(.head):hover{background:var(--panel-3);border-color:var(--line-2);transform:translateX(2px)}
}

/* --- 7. Yon panel --- */
.nav-item{transition:background .22s,color .22s,transform .22s}
@media (hover:hover){.nav-item:not(.on):hover{transform:translateX(3px)}}
.nav-item.on{box-shadow:0 10px 26px -20px rgba(var(--brand-rgb),.95)}
.nav-item.on::before{transition:top .3s,bottom .3s,opacity .3s}

/* --- 8. Mobil sayqal --- */
@media(max-width:980px){
  .bottomnav{overflow-x:auto;scrollbar-width:none}
  .bottomnav::-webkit-scrollbar{display:none}
  .bn{min-width:62px;transition:color .22s,background .22s}
  .bn .i{transition:transform .25s cubic-bezier(.16,1,.3,1)}
  .bn.on .i{transform:translateY(-1px) scale(1.07)}
  .bn:active{transform:scale(.96)}
  .topbar .searchbar input{font-size:13.5px}
  .page-head{align-items:flex-start}
  .page-head .h1{font-size:20px}
}
@media(max-width:400px){ .bn{font-size:9.5px;min-width:56px} }

/* --- 9. Bildirishnoma (toast) --- */
.toast{box-shadow:var(--sh-lift);animation:toastIn .4s cubic-bezier(.16,1,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}

/* --- 10. Modal --- */
.mbox{animation:pop .26s cubic-bezier(.2,1.12,.35,1)}
.mhead{gap:12px}

/* --- 11. Landing: nav, FAQ, footer --- */
.lnav-links a.on{color:var(--txt);background:var(--panel-2)}
.lnav-links a{position:relative}
.fq{transition:border-color .25s,background .25s,transform .25s}
@media (hover:hover){.fq:not(.open):hover{border-color:var(--line-2);transform:translateX(2px)}}
.fq-q:hover{color:var(--txt)}
.fq.open .fq-q{color:var(--txt)}
.lfoot-links a{position:relative}
.lfoot-links a::after{content:"";position:absolute;left:0;bottom:-3px;height:1px;width:0;background:var(--accent);transition:width .3s}
.lfoot-links a:hover::after{width:100%}
.ldone .i{animation:donePop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes donePop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* ---------- print ---------- */
@media print{
  body{background:#FFFDF7}
  .sidebar,.topbar,.bottomnav,.fab,.toasts,.lnav,.lfoot,.bottomnav,.mback .mhead .btn-icon,.no-print{display:none!important}
  /* chop etiladigan kartochka toza va aniq chiqadi */
  .mback{background:#FFFDF7!important;backdrop-filter:none!important;animation:none!important}
  .mbox{box-shadow:none!important;border:0!important;animation:none!important;max-height:none!important}
  html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-only{display:block!important}
  /* Modal ochiq holda chop etilganda FAQAT modal chiqadi (orqadagi sahifa tushib qolmaydi).
     Ilgari sertifikat bilan birga «Ma'lumot» sahifasi ham bosilardi — 2 varaq. */
  body:has(.mback) #app{display:none!important}
  body:has(.mback) .mback{position:static!important;display:block!important;background:#FFFDF7!important;padding:0!important;
    overflow:visible!important;backdrop-filter:none!important;animation:none!important}
  body:has(.mback) .mbox{max-height:none!important;overflow:visible!important;box-shadow:none!important;margin:0 auto}
  body:has(.mback) .mback .btn,.mback .no-print{display:none!important}   /* modal ichidagi tugmalar qog'ozga tushmasin */
  .mback .mhead .btn-icon{display:none!important}
  /* Kirish kartochkasi chop etilganda faqat karta chiqadi (orqa fon toza) */
  /* Butun ilova o'rniga faqat kartochka chiqadi (body overflow:visible bo'lmasa kontent kesiladi) */
  body:has(#loginCard){overflow:visible!important;height:auto!important}
  body:has(#loginCard) #app{display:none!important}
  body:has(#loginCard) .sidebar,body:has(#loginCard) .topbar,body:has(#loginCard) .content,
  body:has(#loginCard) .fab,body:has(#loginCard) .toasts,body:has(#loginCard) .bottomnav,body:has(#loginCard) .globalstrip{display:none!important}
  body:has(#loginCard) #modal-root{margin:0}
  body:has(#loginCard) .mbox{max-height:none!important;overflow:visible!important}
  body:has(#loginCard) .mback{position:static!important;display:block!important;background:#FFFDF7!important;padding:0!important;backdrop-filter:none!important}
  body:has(#loginCard) .mbox{margin:0 auto;max-width:520px;padding:0}
  /* Bosma oq-qora bo'lsa ham o'qiladi: modal yorug' palitraga o'tadi */
  .mbox{background:#FFFDF7!important;color:var(--brand-ink)!important;border:0!important}
  .mbox .h1,.mbox .h2,.mbox .h3,.mbox b,.mbox strong{color:var(--brand-ink)!important}
  .mbox .muted,.mbox .xs.muted,.mbox .small.muted,.mbox .up.muted{color:#41506F!important}
  .mbox .card{background:#FBF6EA!important;border-color:#D9CDB1!important;box-shadow:none!important}
  #loginCard{border:1.5px solid var(--brand-ink)!important;break-inside:avoid}
  .mbox .tag{background:#FBF6EA!important;color:var(--brand-ink)!important;border-color:#D9CDB1!important}
  .mbox .tag.a{background:#FBF6EA!important;color:var(--accent-ink)!important;border-color:var(--line-2)!important}
  .mbox .divider,.mbox .hr{background:#D9CDB1!important}
  .mbox .avatar .tx{color:#FFFDF7!important}
  .mback{position:static;background:#FFFDF7;padding:0;display:block}
  .mbox{max-width:none;box-shadow:none;border:0;padding:0}
  .cert{color:var(--brand-ink);background:#FFFDF7;border-color:var(--brand-ink)}
}
/* ---------- o'rnatilgan ilova (standalone) rejimi ----------
   Telefonda «Bosh ekranga qo'shish» qilinganda ilova brauzer panelisiz ochiladi:
   yuqorida status-bar/notch, yonlarda va pastda xavfsiz hudud (safe-area) paydo bo'ladi.
   env() qiymatlari oddiy brauzerda 0 bo'ladi — ya'ni bu blok hech narsani buzmaydi. */
@media (display-mode: standalone), (display-mode: minimal-ui){
  .topbar{padding-top:calc(11px + env(safe-area-inset-top) + env(safe-area-inset-bottom,0px)*0)}
  .sidebar{padding-top:calc(18px + env(safe-area-inset-top))}
  .lnav{padding-top:calc(13px + env(safe-area-inset-top))}
  .lprog{top:env(safe-area-inset-top)}
  .auth{padding-top:env(safe-area-inset-top)}
  .content{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
  .bottomnav{padding-left:calc(8px + env(safe-area-inset-left));padding-right:calc(8px + env(safe-area-inset-right))}
  .fab{right:calc(15px + env(safe-area-inset-right))}
}
@media (display-mode: standalone) and (orientation: landscape){
  .sidebar{padding-left:calc(14px + env(safe-area-inset-left))}
}

/* ---------- haftalik lenta (7 kun) ---------- */
.strip7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:760px){
  /* telefonda siqilib buzilmasin: yonma-yon skroll */
  .strip7{grid-template-columns:repeat(7,minmax(86px,1fr));overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
  .strip7::-webkit-scrollbar{display:none}
}

/* ==========================================================================
   v2.4.0 — PREMIUM SAYQAL
   Maqsad: interfeys «oddiy» emas, chuqur va qimmat ko'rinsin.
   Qoidalar: barcha yangi ranglar mavjud palitradan olinadi (kontrast AA
   saqlanadi), animatsiyalar `prefers-reduced-motion` bilan o'chadi,
   qatlamlar soni kam — 200+ talabali jadval ham tez qoladi.
   ========================================================================== */

/* --- 1. Yuza va chuqurlik ------------------------------------------------- */
:root{
  --sh-sm:0 2px 6px -2px rgba(0,0,0,.5);
  --sh-md:0 14px 34px -18px rgba(0,0,0,.75),0 2px 8px -4px rgba(0,0,0,.5);
  --sh-lg:0 30px 70px -30px rgba(5,8,20,.95),0 8px 24px -14px rgba(0,0,0,.6);
  --edge:rgba(255,255,255,.06);           /* yuqori yorug' qirra */
  --glow-p:rgba(var(--brand-rgb),.45);
  --glow-c:rgba(var(--brand2-rgb),.4);
  --glow-a:rgba(var(--accent-rgb),.35);
}
[data-theme="light"]{
  --sh-sm:0 1px 3px rgba(16,26,56,.08);
  --sh-md:0 10px 26px -16px rgba(20,34,74,.35),0 1px 3px rgba(16,26,56,.06);
  --sh-lg:0 28px 60px -32px rgba(20,34,74,.45),0 4px 14px -8px rgba(20,34,74,.14);
  --edge:rgba(255,255,255,.9);
}
.card{
  background-image:linear-gradient(180deg,var(--edge),transparent 88px);
  box-shadow:var(--sh-md),inset 0 1px 0 var(--edge);
  transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .3s,box-shadow .35s,background .3s;
}
.card.soft{box-shadow:inset 0 1px 0 var(--edge)}
.card.glass{box-shadow:var(--sh-md),inset 0 1px 0 rgba(255,255,255,.08)}
@media (hover:hover){
